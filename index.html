const authScreen = document.getElementById('authScreen');
const authMsg = document.getElementById('authMsg');
const logoutBtn = document.getElementById('logoutBtn');
const settingsBtnEl = document.getElementById('settingsBtn');
function showAuthMsg(text, kind){ authMsg.textContent = text; authMsg.className = 'auth-msg ' + (kind||''); }
function hideAuthScreen(){ authScreen.classList.add('hidden'); }

/* A signed-out visitor who explicitly chooses "continue without an account" expects the
   board to just be there next time they open it — not ask them to dismiss the auth screen
   again on every single reload. This flag remembers that choice; it's cleared the moment a
   real account signs in, so a genuine login always takes priority over it. */
const OFFLINE_FLAG_KEY = 'wp-offline-mode-v1';
let appBuilt = false;
async function onSignedIn(user){
  if(appBuilt) return;
  appBuilt = true;
  try{ localStorage.removeItem(OFFLINE_FLAG_KEY); }catch(e){}
  currentUserId = user.id;
  currentUserEmail = user.email || null;
  currentUserCreatedAt = user.created_at || null;
  hideAuthScreen();
  logoutBtn.style.display = 'inline-block';
  settingsBtnEl.style.display = 'inline-flex';
  showAuthMsg('', '');
  wipeLocalDataIfAccountChanged(user.id);
  await fetchAllCloudData(user.id);
  await migrateLocalToCloud(user.id);
  setSyncBadge('ok');
  applyTheme(load('wp-theme-v5', currentTheme));
  const cloudLangPref = load(LANGUAGE_PREF_KEY, null);
  if(cloudLangPref !== null){ languagePref = cloudLangPref; }
  else { const legacyCloud = load(LEGACY_LANGUAGE_KEY, null); if(SUPPORTED_LANGUAGES.includes(legacyCloud)) languagePref = legacyCloud; }
  currentLanguage = resolveLanguage(languagePref);
  buildApp();
}
function startOffline(){
  if(appBuilt) return;
  appBuilt = true;
  try{ localStorage.setItem(OFFLINE_FLAG_KEY, '1'); }catch(e){}
  hideAuthScreen();
  settingsBtnEl.style.display = 'inline-flex';
  buildApp();
}

if(sb){
  document.getElementById('authSignupBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!email || password.length < 6){ showAuthMsg(t('authErrEmailPass'), 'error'); return; }
    showAuthMsg(t('authCreating'), '');
    const { error } = await sb.auth.signUp({ email, password });
    if(error) showAuthMsg(error.message, 'error');
    else showAuthMsg(t('authCheckEmail'), 'notice');
  });
  document.getElementById('authLoginBtn').addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if(!email || !password){ showAuthMsg(t('authErrEmailPass2'), 'error'); return; }
    showAuthMsg(t('authLoggingIn'), '');
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error) showAuthMsg(error.message, 'error');
  });
  logoutBtn.addEventListener('click', async ()=>{ try{ localStorage.removeItem(OFFLINE_FLAG_KEY); }catch(e){} await sb.auth.signOut(); location.reload(); });
  sb.auth.onAuthStateChange((event, session)=>{
    if(event === 'SIGNED_IN' && session && session.user){ onSignedIn(session.user); }
  });
  sb.auth.getSession().then(({ data })=>{
    if(data && data.session && data.session.user){ onSignedIn(data.session.user); }
    else if(localStorage.getItem(OFFLINE_FLAG_KEY) === '1'){ startOffline(); }
  });
} else if(localStorage.getItem(OFFLINE_FLAG_KEY) === '1'){
  startOffline();
} else {
  showAuthMsg(t('authOfflineNotice'), 'notice');
}

        let { width, height } = img;
        if(width > height){ if(width > maxSize){ height *= maxSize/width; width = maxSize; } }
        else { if(height > maxSize){ width *= maxSize/height; height = maxSize; } }
        const c = document.createElement('canvas'); c.width = width; c.height = height;
        c.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/png'));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
function resizeImageJPEG(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height){ if(width > maxSize){ height *= maxSize/width; width = maxSize; } }
        else { if(height > maxSize){ width *= maxSize/height; height = maxSize; } }
        const c = document.createElement('canvas'); c.width = width; c.height = height;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,width,height); // flatten transparency for JPEG
        ctx.drawImage(img, 0, 0, width, height);
        resolve(c.toDataURL('image/jpeg', quality||0.78));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ============ GLOBAL STICKER PLACEMENT (Date View only, freeform) ============
   Placed stickers are decorative-only until tapped: a tap on an unselected sticker only
   selects it (shows resize/rotate/delete handles + a dashed outline) without moving it, so a
   stray touch while scrolling can't drag it. A second, explicit drag on an already-selected
   sticker moves it; tapping anywhere outside any sticker deselects it back to a clean, fixed
   decoration. This mirrors the tap-to-edit / tap-outside-to-deselect pattern already used for
   MySpace widgets elsewhere in the app. */
let stickerZones = load('wp-stickerzones-v5', {});
function zoneItems(zoneKey){ return stickerZones[zoneKey] || (stickerZones[zoneKey] = []); }
function stickerTransformCSS(rot, scale){
  return { main:`rotate(${rot}deg) scale(${scale})`, counter:`rotate(${-rot}deg) scale(${1/scale})` };
}
function applyStickerTransform(el, rot, scale){
  const { main, counter } = stickerTransformCSS(rot, scale);
  el.style.transform = main;
  el.querySelectorAll('.stk-handle').forEach(h=> h.style.transform = counter);
}
function stickerLayerHtml(dataKey){
  const items = zoneItems(dataKey);
  return items.map(it=>{
    const src = resolveStickerSrc(it.sid);
    if(!src) return '';
    const scale = it.scale || 1;
    const rot = it.rot || 0;
    const { main, counter } = stickerTransformCSS(rot, scale);
    return `<div class="stick-inst" data-key="${dataKey}" data-iid="${it.iid}" style="left:${it.x}%; top:${it.y}%; transform:${main};">
      <img src="${src}" alt="sticker">
      <div class="stk-handle resize" style="transform:${counter};" title="${t('resizeSticker')}">⇲</div>
      <div class="stk-handle rotate" style="transform:${counter};" title="${t('rotateSticker')}">↻</div>
      <div class="stk-handle del" style="transform:${counter};" title="${t('deleteSticker')}">✕</div>
    </div>`;
  }).join('');
}
function renderStickerLayer(domSlotKey, dataKey){
  const layer = document.getElementById('stickerLayer-'+domSlotKey);
  if(!layer) return;
  const keepSelectedIid = (selectedStickerZoneEl === layer) ? selectedStickerIid : null;
  layer.innerHTML = stickerLayerHtml(dataKey);
  deselectAllStickers();
  layer.querySelectorAll('.stick-inst').forEach(el=>{
    makeDraggableInZone(el, layer, dataKey);
    el.querySelector('.stk-handle.del').addEventListener('click', (ev)=>{
      ev.stopPropagation();
      stickerZones[dataKey] = zoneItems(dataKey).filter(s=> String(s.iid) !== el.dataset.iid);
      save('wp-stickerzones-v5', stickerZones);
      deselectAllStickers();
      renderStickerLayer(domSlotKey, dataKey);
    });
    if(keepSelectedIid && String(el.dataset.iid) === String(keepSelectedIid)) selectSticker(el, layer);
  });
}

function makeDraggableInZone(el, zone, zoneKey){
  const pointers = new Map();
  let mode = null; // 'drag' | 'pinch' | 'resize' | 'rotate'
  let offX=0, offY=0;
  let pinchStartDist=0, pinchStartScale=1, liveScale = null;
  let resizeStartDist=0, resizeStartScale=1;
  let rotateStartAngle=0, rotateStartRot=0, liveRot = null;

  function getStored(){ return zoneItems(zoneKey).find(s=> String(s.iid) === el.dataset.iid); }
  function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
  function currentRot(){ const st = getStored(); return st ? (st.rot||0) : 0; }
  function currentScale(){ const st = getStored(); return st ? (st.scale||1) : 1; }
  function center(){ const r = el.getBoundingClientRect(); return { x:r.left+r.width/2, y:r.top+r.height/2 }; }

  function startDrag(e){
    mode = 'drag';
    const rect = zone.getBoundingClientRect();
    offX = e.clientX - (rect.left + (parseFloat(el.style.left)/100)*rect.width);
    offY = e.clientY - (rect.top + (parseFloat(el.style.top)/100)*rect.height);
  }
  function startPinch(){
    mode = 'pinch';
    const pts = Array.from(pointers.values());
    pinchStartDist = dist(pts[0], pts[1]);
    pinchStartScale = currentScale();
  }
  function startResize(e){
    mode = 'resize';
    const c = center();
    resizeStartDist = Math.max(1, Math.hypot(e.clientX-c.x, e.clientY-c.y));
    resizeStartScale = currentScale();
  }
  function startRotate(e){
    mode = 'rotate';
    const c = center();
    rotateStartAngle = Math.atan2(e.clientY-c.y, e.clientX-c.x) * 180/Math.PI;
    rotateStartRot = currentRot();
  }

  el.addEventListener('pointerdown', (e)=>{
    if(e.target.closest('.stk-handle')) return; // handles have their own listeners below
    if(!el.classList.contains('selected')){
      selectSticker(el, zone);
      return; // this tap only selects — moving it takes an explicit second gesture
    }
    el.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
    if(pointers.size === 1) startDrag(e);
    else if(pointers.size === 2) startPinch();
  });

  el.addEventListener('pointermove', (e)=>{
    if(!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });

    if(mode === 'pinch' && pointers.size >= 2){
      const pts = Array.from(pointers.values());
      const newDist = dist(pts[0], pts[1]);
      if(pinchStartDist > 0){
        let scale = pinchStartScale * (newDist / pinchStartDist);
        scale = Math.max(0.4, Math.min(3, scale));
        liveScale = scale;
        applyStickerTransform(el, currentRot(), scale);
      }
    } else if(mode === 'drag' && pointers.size === 1){
      const rect = zone.getBoundingClientRect();
      if(rect.width < 1) return;
      let xPct = ((e.clientX - offX - rect.left)/rect.width)*100;
      let yPct = ((e.clientY - offY - rect.top)/rect.height)*100;
      xPct = Math.max(0, Math.min(94, xPct)); yPct = Math.max(0, Math.min(96, yPct));
      el.style.left = xPct+'%'; el.style.top = yPct+'%';
    }
  });

  function release(e){
    pointers.delete(e.pointerId);
    const st = getStored();
    if(st){
      st.x = parseFloat(el.style.left); st.y = parseFloat(el.style.top);
      if(liveScale !== null){ st.scale = liveScale; }
      save('wp-stickerzones-v5', stickerZones);
    }
    if(pointers.size === 1){
      // one finger remains after a pinch — resume dragging with it
      liveScale = null;
      const [remaining] = pointers.values();
      startDrag({ clientX: remaining.x, clientY: remaining.y });
    } else if(pointers.size === 0){
      mode = null; liveScale = null;
    }
  }
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);

  /* resize/rotate handles compute their gesture from the sticker's live on-screen center
     (getBoundingClientRect already reflects the current transform), so both work correctly
     regardless of the sticker's current rotation — no rotation-aware vector math needed for
     resize (distance-from-center is rotation-invariant), and rotation is just the pointer's
     angle around that same center. */
  const resizeHandle = el.querySelector('.stk-handle.resize');
  resizeHandle.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    resizeHandle.setPointerCapture(e.pointerId);
    startResize(e);
  });
  resizeHandle.addEventListener('pointermove', (e)=>{
    if(mode !== 'resize') return;
    const c = center();
    const d = Math.max(1, Math.hypot(e.clientX-c.x, e.clientY-c.y));
    let scale = resizeStartScale * (d/resizeStartDist);
    scale = Math.max(0.4, Math.min(3, scale));
    liveScale = scale;
    applyStickerTransform(el, currentRot(), scale);
  });
  function endResize(){
    if(mode !== 'resize') return;
    const st = getStored();
    if(st && liveScale !== null) st.scale = liveScale;
    save('wp-stickerzones-v5', stickerZones);
    liveScale = null; mode = null;
  }
  resizeHandle.addEventListener('pointerup', endResize);
  resizeHandle.addEventListener('pointercancel', endResize);

  const rotateHandle = el.querySelector('.stk-handle.rotate');
  rotateHandle.addEventListener('pointerdown', (e)=>{
    e.stopPropagation();
    rotateHandle.setPointerCapture(e.pointerId);
    startRotate(e);
  });
  rotateHandle.addEventListener('pointermove', (e)=>{
    if(mode !== 'rotate') return;
    const c = center();
    const angle = Math.atan2(e.clientY-c.y, e.clientX-c.x) * 180/Math.PI;
    liveRot = rotateStartRot + (angle - rotateStartAngle);
    applyStickerTransform(el, liveRot, currentScale());
  });
  function endRotate(){
    if(mode !== 'rotate') return;
    const st = getStored();
    if(st && liveRot !== null) st.rot = liveRot;
    save('wp-stickerzones-v5', stickerZones);
    liveRot = null; mode = null;
  }
  rotateHandle.addEventListener('pointerup', endRotate);
  rotateHandle.addEventListener('pointercancel', endRotate);
}

function addTodo(key, root){
  const input = root.querySelector(`.todo-input[data-key="${key}"]`);
  const moodBtn = root.querySelector(`.task-mood-btn[data-key="${key}"]`);
  const text = input.value.trim();
  if(!text) return;
  const emoji = moodBtn ? (moodBtn.dataset.chosenEmoji || '') : '';
  daysData[key].todos.push({ text, done:false, vibe: emoji });
  save('wp-days-v5', daysData);
  input.value = '';

function moveTodoToTomorrow(key, i){
  const dd = daysData[key];
  if(!dd || !dd.todos[i]) return;
  const [task] = dd.todos.splice(i, 1);
  const tomorrow = parseDateKey(key);
  tomorrow.setDate(tomorrow.getDate()+1);
  // Same object, just relocated — nothing is duplicated and its done/vibe state is untouched,
  // so moving a task never silently completes it or loses its mood tag.
  ensureDayData(dateKeyOf(tomorrow)).todos.push(task);
  save('wp-days-v5', daysData);
  renderTodos(key);
}
function renderTodos(key){
  const list = document.getElementById('todos-'+key);
  if(!list) return;
  const todos = daysData[key].todos;
  if(!todos.length){ list.innerHTML = `<li class="todo-empty">${t('todoEmpty')}</li>`; return; }
  list.innerHTML = todos.map((td,i)=>`
    <li class="todo-item ${td.done?'done':''}">

      <button class="todo-check" data-key="${key}" data-i="${i}">${td.done?'✓':''}</button>
      <span class="todo-text" data-key="${key}" data-i="${i}">${td.text.replace(/</g,'&lt;')}</span>

/* ---- exchange rates: two independent, real, keyless public providers, cached with staleness handling ----
   NOTE: both are genuine third-party endpoints, not invented, and need no API key so they're safe to
   call directly from the browser.
   Provider 1 (open.er-api.com) is a small free API server — CORS-enabled and normally reliable, but
   like any single small server it can occasionally be unreachable for a given network/device
   ("Load failed" in Safari usually means exactly this: the request never got a response).
   Provider 2 (currency-api) is served as static JSON off the jsdelivr / Cloudflare CDN, which is far
   harder to have an outage on since there's no origin server to go down — it's used as a fallback.
   If both fail, the app falls back to the last cached rates (clearly labeled) rather than pretending
   a conversion is accurate; if there's no cache either, it says so honestly instead of guessing. */
const FX_MAX_AGE_MS = 12*60*60*1000;
async function fetchFxRatesProvider1(base){
  const res = await fetch('https://open.er-api.com/v6/latest/'+encodeURIComponent(base));
  if(!res.ok) throw new Error('provider1 http '+res.status);
  const data = await res.json();
  if(data.result !== 'success' || !data.rates) throw new Error('provider1 bad payload');
  return { base, rates:data.rates, fetchedAt:Date.now() };
}
async function fetchFxRatesProvider2(base){
  const b = base.toLowerCase();
  const urls = [
    'https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/'+b+'.json',
    'https://latest.currency-api.pages.dev/v1/currencies/'+b+'.json',
  ];
  let lastErr;
  for(const url of urls){
    try{
      const res = await fetch(url);
      if(!res.ok) throw new Error('provider2 http '+res.status);
      const data = await res.json();
      const lowerRates = data[b];
      if(!lowerRates) throw new Error('provider2 bad payload');
      const rates = {};
      Object.keys(lowerRates).forEach(k=> rates[k.toUpperCase()] = lowerRates[k]);
      return { base, rates, fetchedAt:Date.now() };
    } catch(err){ lastErr = err; }
  }
  throw lastErr || new Error('provider2 failed');
}
async function fetchFxRates(base){
  try{ return await fetchFxRatesProvider1(base); }
  catch(err1){
    console.warn('fx provider1 (open.er-api.com) unreachable, trying fallback…', err1.message);
    try{
      const result = await fetchFxRatesProvider2(base);
      console.info('fx: recovered via fallback provider (currency-api CDN)');
      return result;
    }
    catch(err2){
      console.error('fx: BOTH providers unreachable —', err1.message, '/', err2.message);
      throw new Error('all exchange rate providers unreachable');
    }
  }
}
async function getFxRates(base){
  const cached = load('wp-fx-rates-v1-'+base, null);
  if(cached && (Date.now()-cached.fetchedAt) < FX_MAX_AGE_MS) return { ...cached, stale:false, error:null };
  // Opened as a local file (double-clicked, not hosted) — some browsers, notably Safari, block
  // fetch() to remote servers entirely from a file:// page regardless of CORS or which provider
  // is tried, so don't burn retries on it and say so plainly instead of a generic network error.
  if(location.protocol === 'file:'){
    if(cached) return { ...cached, stale:true, error:'file://' };
    return { base, rates:null, fetchedAt:null, stale:true, error:'file://' };
  }
  if(navigator.onLine !== false){
    try{
      const live = await fetchFxRates(base);
      save('wp-fx-rates-v1-'+base, live);
      return { ...live, stale:false, error:null };
    } catch(err){
      console.error('fx fetch failed', err);
      if(cached) return { ...cached, stale:true, error:err.message };
      return { base, rates:null, fetchedAt:null, stale:true, error:err.message };
    }
  }
  if(cached) return { ...cached, stale:true, error:'offline' };
  return { base, rates:null, fetchedAt:null, stale:true, error:'offline, no cache yet' };
}
function convertViaRates(amount, fromCcy, rates){
  if(!rates || !rates.rates) return null;
  if(fromCcy === rates.base) return amount;
  const r = rates.rates[fromCcy];
  if(!r) return null;
  return amount / r;
}

/* The currency-tracking list (expenseCurrencies) is one shared piece of state, but it's
   managed from two different places in the UI — the Month view's expense section AND the
   Day view's expense section — so a currency added while looking at a single day doesn't
   require a trip to the month page. Both panels use their own element ids (dayExp* vs exp*)
   so updating one never clobbers the other via a duplicate-id getElementById collision. */
function renderCurrencyChipsInto(chipsElId, addSelectId, addBtnId){
  const el = document.getElementById(chipsElId);
  if(!el) return;
  const shown = expenseCurrencies.filter(c=> ALLOWED_CURRENCIES.includes(c));
  el.innerHTML = shown.map(c=> `<span class="currency-chip">${c}<button type="button" class="currency-chip-del" data-ccy="${c}" ${shown.length<=1?'disabled':''}>✕</button></span>`).join('');
  el.querySelectorAll('.currency-chip-del').forEach(btn=> btn.addEventListener('click', ()=>{
    if(shown.length<=1) return;
    expenseCurrencies = expenseCurrencies.filter(c=> c!==btn.dataset.ccy);
    if(expenseDisplayCcy === btn.dataset.ccy){ expenseDisplayCcy = expenseCurrencies.find(c=>ALLOWED_CURRENCIES.includes(c)) || 'EUR'; save('wp-expense-display-ccy-v1', expenseDisplayCcy); }
    saveCurrencies();
    refreshAllExpenseViews();
  }));
  // the "add currency" control is a plain <select> of the remaining allowed codes —
  // never free-text entry, so a currency can only ever be one of the 5 supported ones.
  const remaining = ALLOWED_CURRENCIES.filter(c=> !expenseCurrencies.includes(c));
  const addSelect = document.getElementById(addSelectId);
  const addBtn = document.getElementById(addBtnId);
  if(addSelect && addBtn){
    if(remaining.length){
      addSelect.innerHTML = remaining.map(c=> `<option value="${c}">${c}</option>`).join('');
      addSelect.style.display = ''; addBtn.style.display = ''; addBtn.disabled = false;
    } else {
      addSelect.innerHTML = ''; addSelect.style.display = 'none'; addBtn.style.display = 'none';
    }
  }
}
function renderCurrencyChips(){
  renderCurrencyChipsInto('expenseCurrencyChips', 'expAddCurrencySelect', 'expAddCurrencyBtn');
  renderCurrencyChipsInto('dayExpenseCurrencyChips', 'dayExpAddCurrencySelect', 'dayExpAddCurrencyBtn');
  renderCurrencyChipsInto('budgetCurrencyChips', 'budgetAddCurrencySelect', 'budgetAddCurrencyBtn');
}
function addCurrencyFlow(selectId){
  const addSelect = document.getElementById(selectId);
  const clean = addSelect && addSelect.value;
  if(!clean || !ALLOWED_CURRENCIES.includes(clean) || expenseCurrencies.includes(clean)) return;
  expenseCurrencies.push(clean);
  saveCurrencies();
  refreshAllExpenseViews();
}

function defaultExpenseDateForMonth(monthKey){
  const todayKey = dateKeyOf(todayReal);
  return todayKey.slice(0,7) === monthKey ? todayKey : monthKey+'-01';
}
async function renderMonthExpenseSection(monthKey){
  const items = expensesForMonth(monthKey).slice().sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  const totalsByCcy = {};
  items.forEach(e=> totalsByCcy[e.currency] = (totalsByCcy[e.currency]||0)+e.amount);
  const totalsCcys = Object.keys(totalsByCcy); // only currencies actually spent this month — no padding with zero-balance currencies
  const totalsEl = document.getElementById('expenseCurrencyTotals');
  if(totalsEl) totalsEl.innerHTML = totalsCcys.length
    ? totalsCcys.map(c=> `<div class="expense-ccy-total"><span>${c}</span><span>${fmtMoney(totalsByCcy[c], c)}</span></div>`).join('')
    : `<div class="month-expense-empty">${t('noExpensesYet')}</div>`;

  renderExpenseList('monthExpenseList', items, { showDate:true });

  // the "Total in ___" picker can still offer any currency the user has added, even with $0 this month —
  // it's a converter picker, not a totals display, so it's unaffected by the fix above.
  const dispCcys = Array.from(new Set([...expenseCurrencies.filter(c=>ALLOWED_CURRENCIES.includes(c)), ...totalsCcys]));
  const dispSel = document.getElementById('expenseDisplayCcy');
  if(dispSel){ dispSel.innerHTML = dispCcys.map(c=> `<option value="${c}" ${c===expenseDisplayCcy?'selected':''}>${c}</option>`).join(''); }

  fillCurrencySelect(document.getElementById('expCurrency'));
  fillCategorySelect(document.getElementById('expCategory'));
  const dateEl = document.getElementById('expDate');
  if(dateEl && !dateEl.value) dateEl.value = defaultExpenseDateForMonth(monthKey);

  renderCurrencyChips();
  await refreshCombinedTotal(items);
}
async function refreshCombinedTotal(items){
  const valueEl = document.getElementById('expenseCombinedValue');
  const statusEl = document.getElementById('expenseFxStatus');
  if(!valueEl || !statusEl) return;
  valueEl.textContent = '…';
  statusEl.textContent = t('checkingRates');
  const rates = await getFxRates(expenseDisplayCcy);
  if(!rates.rates){
    valueEl.textContent = '—';
    statusEl.textContent = rates.error === 'file://'
      ? t('fxFileOffline')
      : rates.error && rates.error.indexOf('offline')===0
      ? t('fxNoCacheOffline')
      : t('fxUnavailable');
    return;
  }
  let total = 0, anyMissing = false;
  items.forEach(e=>{ const v = convertViaRates(e.amount, e.currency, rates); if(v===null) anyMissing=true; else total += v; });
  valueEl.textContent = fmtMoney(total, expenseDisplayCcy) + (anyMissing ? ' *' : '');
  const when = rates.fetchedAt ? timeAgo(rates.fetchedAt) : t('timeUnknown');
  statusEl.textContent = (rates.stale ? t('fxCached',{when}) : t('fxUpdated',{when})) + (anyMissing ? t('fxMissingNote') : '');
}

/* ============ BUDGET (Phase 2 primary destination) ============
   A dedicated, full-month view over the SAME `expenses` array/table used by Month and Day —
   no second transaction store. The only schema change is an optional `type` field
   ('expense' | 'income'); a record with no type (every expense ever created before this
   phase, and every one still created via the Month/Day "add expense" forms) is treated as
   an expense, so existing data and existing screens are completely unaffected. Income is
   only ever created here, and only Budget's own transactionsForMonth() shows both types
   together — expensesForMonth()/expensesForDate() (used by Month/Day/My Space) stay
   expense-only, per their existing, unchanged meaning. */
let currentBudgetMonthKey = null;
let budgetAddType = 'expense';
function showBudgetView(monthIdx, year){
  hideAllViews();
  document.getElementById('budgetView').classList.add('active');
  const mi = monthIdx == null ? todayReal.getMonth() : monthIdx;
  const yr = year == null ? APP_YEAR : year;
  buildBudgetView(mi, yr);
  setActiveNavTab('budget');
}
function shiftBudgetMonth(delta){
  const [y,m] = currentBudgetMonthKey.split('-').map(Number);
  const d = new Date(y, (m-1)+delta, 1);
  buildBudgetView(d.getMonth(), d.getFullYear());
}

        <button type="button" class="budget-type-btn" data-type="income">${t('typeIncome')}</button>
      </div>
      <div class="expense-add-form" id="budgetAddForm"></div>
      <div class="expense-currency-manage">
        <span class="hint-text">${t('currenciesInUse')}</span>

function setBudgetAddType(type){
  budgetAddType = type;
  document.querySelectorAll('#budgetTypeToggle .budget-type-btn').forEach(b=>{
    b.classList.toggle('active', b.dataset.type===type);
    b.classList.toggle('income-active', type==='income' && b.dataset.type==='income');
  });
  const formEl = document.getElementById('budgetAddForm');
  if(!formEl) return;
  const savedDate = document.getElementById('budgetDate')?.value || '';
  formEl.innerHTML = type === 'income' ? `
    <input type="number" id="budgetAmount" placeholder="${t('amountPlaceholder')}" step="0.01" min="0">
    <select id="budgetCurrency" title="${t('expenseCurrencyTooltip')}"></select>
    <input type="date" id="budgetDate">
    <input type="text" id="budgetSource" placeholder="${t('incomeSourcePlaceholder')}">
    <button type="button" class="add-btn-outline" id="budgetAddBtn">${t('saveTransaction')}</button>
  ` : `
    <input type="number" id="budgetAmount" placeholder="${t('amountPlaceholder')}" step="0.01" min="0">
    <select id="budgetCurrency" title="${t('expenseCurrencyTooltip')}"></select>
    <input type="date" id="budgetDate">

    <button type="button" class="add-btn-outline" id="budgetAddBtn">${t('saveTransaction')}</button>

  if(dateEl) dateEl.value = savedDate || defaultExpenseDateForMonth(currentBudgetMonthKey);
  document.getElementById('budgetAddBtn').addEventListener('click', addBudgetTransaction);

function addBudgetTransaction(){
  const amount = parseFloat(document.getElementById('budgetAmount').value);
  const currency = document.getElementById('budgetCurrency').value;
  const date = document.getElementById('budgetDate').value;
  if(!amount || !date) return;
  const type = budgetAddType;
  const category = type === 'income' ? '' : (document.getElementById('budgetCategory')?.value || '');
  const note = type === 'income'
    ? (document.getElementById('budgetSource')?.value.trim() || '')
    : (document.getElementById('budgetNote')?.value.trim() || '');
  expenses.push({ id:newId(), date, amount, currency, category, note, type, createdAt:Date.now(), updatedAt:Date.now() });
  saveExpenses();
  document.getElementById('budgetAmount').value = '';
  const noteEl = document.getElementById('budgetNote'); if(noteEl) noteEl.value = '';
  const sourceEl = document.getElementById('budgetSource'); if(sourceEl) sourceEl.value = '';
  refreshAllExpenseViews();
}
function renderBudgetSection(monthKey){
  const items = transactionsForMonth(monthKey).slice().sort((a,b)=> a.date<b.date?1:a.date>b.date?-1:0);
  const spentByCcy = {}, incomeByCcy = {};
  items.forEach(e=>{
    const bucket = e.type==='income' ? incomeByCcy : spentByCcy;
    bucket[e.currency] = (bucket[e.currency]||0) + e.amount;
  });
  const ccys = Array.from(new Set([...Object.keys(spentByCcy), ...Object.keys(incomeByCcy)]));
  const hero = document.getElementById('budgetHero');
  if(hero){
    hero.innerHTML = ccys.length ? ccys.map(c=> `

      <div class="budget-hero-stat income"><div class="lbl">${t('budgetIncome')} · ${c}</div><div class="val">${fmtMoney(incomeByCcy[c]||0, c)}</div></div>

/* ============ PHOTOS ============
   Photos belong to a DAY, not to the Photo widget — this is intentional (per spec):
   the Photo widget only controls whether photos also show up as a widget block in the
   customizable Daily Planner grid. Whether a day HAS photos, and whether you can add/view/
   remove/download them, never depends on that toggle — hence a completely separate storage
   object from widgetDailyData, one single source of truth shared by the Day page AND
   Settings → Media Files (same records, no duplication; deleting from either place deletes
   the same underlying record). */
const MAX_PHOTOS_PER_DAY = 20;
let photosData = load('wp-photos-v1', {});
function ensurePhotosDay(dateKey){ return photosData[dateKey] || (photosData[dateKey] = []); }
function savePhotosData(){ save('wp-photos-v1', photosData); }
function allPhotoDateKeys(){ return Object.keys(photosData).filter(k=> photosData[k] && photosData[k].length).sort(); }

function photoThumbsHtml(photos){
  if(!photos.length) return `<div class="month-goal-empty">${t('noPhotosYet')}</div>`;
  return `<div class="photo-thumb-row">` + photos.map(p=>`
    <div class="photo-thumb-wrap">
      <img class="photo-thumb" src="${p.src}" data-view="${p.id}" alt="">
    </div>`).join('') + `</div>`;
}
function photosSectionHtml(key){
  const photos = ensurePhotosDay(key);
  return `<div class="photos-block" data-key="${key}">
      <div class="habit-label">${t('photosLabel')} (${photos.length})</div>
      <div id="photoThumbs-${key}">${photoThumbsHtml(photos)}</div>
      <input type="file" id="photoInput-${key}" accept="image/*" multiple style="display:none">
      <button type="button" class="add-btn-outline" id="photoAddBtn-${key}" ${photos.length>=MAX_PHOTOS_PER_DAY?'disabled':''}>${t('addPhotos')}</button>
    </div>`;
}
function openPhotoViewer(dateKey, photoId){
  const photos = ensurePhotosDay(dateKey);
  const photo = photos.find(p=> String(p.id)===String(photoId));
  if(!photo) return;
  const viewer = document.getElementById('photoViewer');
  document.getElementById('photoViewerImg').src = photo.src;
  viewer.dataset.dateKey = dateKey;
  viewer.dataset.photoId = photo.id;
  viewer.classList.add('open');
}
function closePhotoViewer(){ document.getElementById('photoViewer').classList.remove('open'); }
function bindPhotosSection(key, root){
  const wrap = root.querySelector(`.photos-block[data-key="${key}"]`);
  if(!wrap) return;
  const input = wrap.querySelector(`#photoInput-${key}`);
  const addBtn = wrap.querySelector(`#photoAddBtn-${key}`);
  const thumbsEl = wrap.querySelector(`#photoThumbs-${key}`);
  function rerenderThumbs(){
    const photos = ensurePhotosDay(key);
    thumbsEl.innerHTML = photoThumbsHtml(photos);
    wrap.querySelector('.habit-label').textContent = `${t('photosLabel')} (${photos.length})`;
    addBtn.disabled = photos.length >= MAX_PHOTOS_PER_DAY;
    thumbsEl.querySelectorAll('.photo-thumb').forEach(img=> img.addEventListener('click', ()=> openPhotoViewer(key, img.dataset.view)));
  }
  rerenderThumbs();
  addBtn.addEventListener('click', ()=> input.click());
  input.addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    const photos = ensurePhotosDay(key);
    const room = MAX_PHOTOS_PER_DAY - photos.length;
    for(const file of files.slice(0, Math.max(0, room))){
      try{
        const src = await resizeImageJPEG(file, 1280, 0.78);
        photos.push({ id:newId(), date:key, src, caption:'', event:'', favorite:false, location:'', tags:[], createdAt:Date.now(), order:photos.length });
      } catch(err){ console.error('photo resize failed', err); }
    }
    savePhotosData();
    rerenderThumbs();
    input.value = '';
  });
}
function downloadPhoto(dateKey, photoId){
  const photos = ensurePhotosDay(dateKey);
  const photo = photos.find(p=> String(p.id)===String(photoId));
  if(!photo) return;
  const a = document.createElement('a');
  a.href = photo.src; a.download = 'svoj-photo-' + dateKey + '.jpg';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function deletePhoto(dateKey, photoId, onDone){
  if(!confirm(t('deletePhotoConfirm'))) return;
  const photos = ensurePhotosDay(dateKey);
  const idx = photos.findIndex(p=> String(p.id)===String(photoId));
  if(idx>-1) photos.splice(idx,1);
  if(!photos.length) delete photosData[dateKey];
  savePhotosData();
  if(onDone) onDone();
}
document.getElementById('photoViewerClose').addEventListener('click', closePhotoViewer);
document.getElementById('photoViewer').addEventListener('click', (e)=>{ if(e.target.id==='photoViewer') closePhotoViewer(); });
document.getElementById('photoViewerDownload').addEventListener('click', ()=>{
  const v = document.getElementById('photoViewer');
  downloadPhoto(v.dataset.dateKey, v.dataset.photoId);
});
document.getElementById('photoViewerDelete').addEventListener('click', ()=>{
  const v = document.getElementById('photoViewer');
  deletePhoto(v.dataset.dateKey, v.dataset.photoId, ()=>{
    closePhotoViewer();
    // refresh whichever screen is currently showing this day's photos
    if(document.getElementById('dateView').classList.contains('active') && openDate && dateKeyOf(openDate)===v.dataset.dateKey){
      const thumbsEl = document.getElementById('photoThumbs-'+v.dataset.dateKey);
      if(thumbsEl){ thumbsEl.innerHTML = photoThumbsHtml(ensurePhotosDay(v.dataset.dateKey));
        thumbsEl.querySelectorAll('.photo-thumb').forEach(img=> img.addEventListener('click', ()=> openPhotoViewer(v.dataset.dateKey, img.dataset.view))); }
    }
    if(document.getElementById('mediaView').classList.contains('active') && currentMediaMonth !== null) buildMediaMonthView(currentMediaMonth, currentMediaYear);
  });
});

function renderMonthGoals(){
  const list = document.getElementById('monthGoalsList');
  if(!monthGoals.length){ list.innerHTML = `<li class="month-goal-empty">${t('noGoalsYet')}</li>`; }
  else {
    list.innerHTML = monthGoals.map(g=>`
      <li class="month-goal-item ${g.done?'is-done':''}">
        <button type="button" class="month-goal-check" data-id="${g.id}" aria-label="${t('toggleDone')}">${g.done?'☑':'☐'}</button>
        <span class="month-goal-title">${(g.title||'').replace(/</g,'&lt;')}</span>
        <button type="button" class="month-goal-del" data-id="${g.id}" aria-label="${t('delete')}">✕</button>
      </li>`).join('');
  }
  list.querySelectorAll('.month-goal-check').forEach(btn=> btn.addEventListener('click', ()=>{
    const g = monthGoals.find(x=>String(x.id)===btn.dataset.id);
    if(g){ g.done = !g.done; save('wp-month-goals-v1-'+currentMonthKey, monthGoals); renderMonthGoals(); }
  }));
  list.querySelectorAll('.month-goal-del').forEach(btn=> btn.addEventListener('click', ()=>{
    monthGoals = monthGoals.filter(x=>String(x.id)!==btn.dataset.id);
    save('wp-month-goals-v1-'+currentMonthKey, monthGoals);
    renderMonthGoals();
  }));
  document.getElementById('monthGoalAddBtn').disabled = monthGoals.length >= 5;
}
function addMonthGoal(){
  if(monthGoals.length >= 5) return;
  const input = document.getElementById('monthGoalInput');
  const title = input.value.trim();
  if(!title) return;
  monthGoals.push({ id: Date.now()+Math.random(), title, done:false });
  save('wp-month-goals-v1-'+currentMonthKey, monthGoals);
  input.value = '';
  renderMonthGoals();
}

function favEntriesHtml(cat){
  if(!cat.entries.length) return `<div class="month-fav-empty">${t('nothingAddedYet')}</div>`;
  return `<ul class="month-fav-entries">${cat.entries.map(en=>`<li>${(en.text||'').replace(/</g,'&lt;')}<button type="button" class="month-fav-entry-del" data-cat="${cat.id}" data-entry="${en.id}">✕</button></li>`).join('')}</ul>`;
}
function renderMonthFavorites(){
  const wrap = document.getElementById('monthFavCats');
  if(!monthFavorites.length){ wrap.innerHTML = `<div class="month-fav-empty">${t('noCategoriesYet')}</div>`; return; }
  wrap.innerHTML = monthFavorites.map(cat=>`
    <div class="month-fav-card">
      <div class="month-fav-card-head"><span>${cat.label.replace(/</g,'&lt;')}</span><button type="button" class="month-fav-cat-del" data-cat="${cat.id}">✕</button></div>
      <div id="monthFavEntries-${cat.id}">${favEntriesHtml(cat)}</div>
      <div class="month-fav-entry-add">
        <input type="text" data-cat="${cat.id}" class="month-fav-entry-input" placeholder="${t('entryPlaceholder')}">
        <button type="button" class="month-fav-entry-add-btn" data-cat="${cat.id}">+</button>
      </div>
    </div>`).join('');
  wrap.querySelectorAll('.month-fav-cat-del').forEach(btn=> btn.addEventListener('click', ()=>{
    monthFavorites = monthFavorites.filter(c=> String(c.id) !== btn.dataset.cat);
    save('wp-month-favorites-v1-'+currentMonthKey, monthFavorites);
    renderMonthFavorites();
  }));
  wrap.querySelectorAll('.month-fav-entry-add-btn').forEach(btn=> btn.addEventListener('click', ()=> addMonthFavEntry(btn.dataset.cat)));
  wrap.querySelectorAll('.month-fav-entry-input').forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') addMonthFavEntry(e.target.dataset.cat); }));
  wrap.querySelectorAll('.month-fav-entry-del').forEach(btn=> btn.addEventListener('click', ()=>{
    const cat = monthFavorites.find(c=> String(c.id) === btn.dataset.cat);
    if(cat){ cat.entries = cat.entries.filter(en=> String(en.id) !== btn.dataset.entry); save('wp-month-favorites-v1-'+currentMonthKey, monthFavorites); renderMonthFavorites(); }
  }));
}
function addMonthFavEntry(catId){
  const input = document.querySelector(`.month-fav-entry-input[data-cat="${catId}"]`);
  const text = input.value.trim();
  if(!text) return;
  const cat = monthFavorites.find(c=> String(c.id) === catId);
  if(!cat) return;
  cat.entries.push({ id: Date.now()+Math.random(), text });
  save('wp-month-favorites-v1-'+currentMonthKey, monthFavorites);
  renderMonthFavorites();
}

function initDateViewCanvas(key, root){
  const canvas = root.querySelector('#canvas-'+key);
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  const rect = canvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, rect.width*ratio); canvas.height = Math.max(1, rect.height*ratio);
  ctx.scale(ratio, ratio);
  ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=3.2;
  const saved = load('wp-canvas-v5-'+key, null);
  if(saved){ const img = new Image(); img.onload = ()=> ctx.drawImage(img,0,0,rect.width, rect.height); img.src = saved; }
  dateViewCanvasCtx = { ctx, canvas };
  const hint = root.querySelector('#canvasHint-'+key);
  let active = false;
  let drawing = false;
  function deactivateIfOutside(e){
    if(e.target !== canvas){
      active = false;
      canvas.classList.remove('is-active');
      if(hint) hint.style.display = '';
      document.removeEventListener('pointerdown', deactivateIfOutside);
    }
  }
  function activate(){
    if(active) return;
    active = true;
    canvas.classList.add('is-active');
    if(hint) hint.style.display = 'none';
    document.addEventListener('pointerdown', deactivateIfOutside);
  }
  function pos(e){ const r = canvas.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; }
  canvas.onpointerdown = e=>{
    if(!active){ activate(); return; } // first tap just wakes the canvas up — it doesn't draw yet
    drawing=true; canvas.setPointerCapture(e.pointerId); ctx.strokeStyle = dayCanvasColor[key] || PALETTE12[0]; const p=pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y);
  };
  canvas.onpointermove = e=>{ if(!drawing) return; const p=pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); };
  function end(){ if(!drawing) return; drawing=false; save('wp-canvas-v5-'+key, canvas.toDataURL()); }
  canvas.onpointerup = end; canvas.onpointerleave = end; canvas.onpointercancel = end;
}

          <div class="canvas-tap-hint" id="canvasHint-${key}">${t('tapToDraw')}</div>

function widgetBlockHtml(widgetId, key, dd){
  if(SPECIAL_WIDGET_IDS.includes(widgetId)) return specialWidgetHtml(widgetId, key, dd);
  const def = getWidgetDef(widgetId);
  return def ? genericWidgetHtml(def, key) : '';
}
function bindMoodWidget(key, root){
  const el = root.querySelector('.mood-slider'); if(!el) return;
  el.addEventListener('input', e=>{
    const v = +e.target.value;
    e.target.style.setProperty('--val', (v*25)+'%');
    const rounded = Math.round(v);
    if(rounded !== daysData[key].mood){
      daysData[key].mood = rounded;
      root.querySelector('#moodFace-'+key).textContent = MOOD_FACES[rounded];
      save('wp-days-v5', daysData);
    }
  });
}
function bindSleepWidget(key, root){
  const el = root.querySelector('.sleep-slider'); if(!el) return;
  el.addEventListener('input', e=>{
    const v = +e.target.value;
    e.target.style.setProperty('--val', (v/12*100)+'%');
    const rounded = Math.round(v*2)/2;
    daysData[key].sleep = rounded;
    root.querySelector('#sleepVal-'+key).textContent = rounded+' '+t('hrs');
    save('wp-days-v5', daysData);
  });
}
function bindNotesWidget(key, root){
  const el = root.querySelector('.day-notes'); if(!el) return;
  el.addEventListener('input', e=>{ daysData[key].notes = e.target.value; save('wp-days-v5', daysData); });
}
function bindVibesWidget(key, root){
  const vibeOpenBtn = root.querySelector('[data-vibeopen]'); if(!vibeOpenBtn) return;
  vibeOpenBtn.addEventListener('click', ()=> root.querySelector('#vibePicker-'+key).classList.toggle('open'));
  bindVibePicker(key, root);
  bindVibePills(key, root);
}
function bindTasksWidget(key, root){
  const addBtn = root.querySelector('.todo-add-btn'); if(!addBtn) return;
  renderTodos(key);
  addBtn.addEventListener('click', ()=> addTodo(key, root));
  root.querySelector('.todo-input').addEventListener('keydown', e=>{ if(e.key === 'Enter') addTodo(key, root); });
  const moodBtn = root.querySelector('.task-mood-btn');
  moodBtn.addEventListener('click', ()=> root.querySelector('#moodPicker-'+key).classList.toggle('open'));
  root.querySelectorAll('.mood-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = TASK_MOODS[+btn.dataset.i];
      moodBtn.textContent = m.emoji; moodBtn.title = t('taskMoodTooltipWithLabel', { label:t(m.labelKey) }); moodBtn.dataset.chosenEmoji = m.emoji;
      root.querySelector('#moodPicker-'+key).classList.remove('open');
    });
  });
}
function bindDrawingWidget(key, root){
  const paletteEl = root.querySelector('#palette-'+key); if(!paletteEl) return;
  root.querySelectorAll('.color-dot').forEach(dot=>{
    dot.addEventListener('click', ()=>{
      root.querySelectorAll('#palette-'+key+' .color-dot').forEach(dd2=>dd2.classList.remove('active'));
      dot.classList.add('active');
      dayCanvasColor[key] = dot.dataset.color;
    });
  });
  const wheel = root.querySelector('#wheel-'+key);
  wheel.addEventListener('input', ()=>{
    root.querySelectorAll('#palette-'+key+' .color-dot').forEach(dd2=>dd2.classList.remove('active'));
    dayCanvasColor[key] = wheel.value;
  });
  root.querySelector('[data-clear]').addEventListener('click', ()=>{
    if(dateViewCanvasCtx) dateViewCanvasCtx.ctx.clearRect(0,0,dateViewCanvasCtx.canvas.width, dateViewCanvasCtx.canvas.height);
    save('wp-canvas-v5-'+key, null);
  });
  initDateViewCanvas(key, root);
}
function bindWidgetBlock(widgetId, key, root){
  if(widgetId === 'mood') bindMoodWidget(key, root);
  else if(widgetId === 'water') renderWaterDots(key, root);
  else if(widgetId === 'sleep') bindSleepWidget(key, root);
  else if(widgetId === 'vibes') bindVibesWidget(key, root);
  else if(widgetId === 'tasks') bindTasksWidget(key, root);
  else if(widgetId === 'drawing') bindDrawingWidget(key, root);
  else if(widgetId === 'notes') bindNotesWidget(key, root);
  else if(widgetId === 'photos') bindPhotosSection(key, root);
  else { const def = getWidgetDef(widgetId); if(def) bindGenericWidget(def, key, root); }
}
function buildDateView(d){

  const dateViewEl = document.getElementById('dateView');
  const cardStyle = `--fill:${hex}; --pin-color:${hex}; --peek: color-mix(in srgb, ${hex} 20%, var(--paper)); --peek-rot: -2deg;`;
  const dateLine = isToday ? t('greeting',{date:fmtFull(d)}) : fmtFull(d);
  const weekdayName = weekdayFullName(d);
  activeStickerZone = { domSlotKey:'dateview', dataKey:key };

  const widgetsHtml = widgetConfig.enabled.map(wid=> widgetBlockHtml(wid, key, dd)).join('');

  dateViewEl.innerHTML = `
    <div class="date-nav-row">
      <button type="button" class="back-link" id="backToMonthBtn">← ${monthFullName(d.getMonth(), d.getFullYear())}</button>

      <div class="day-head">
        <span class="day-name">${weekdayName}</span>
        <span class="day-date">${dateLine}</span>
      </div>
      <div class="day-grid">
        ${widgetsHtml || `<div class="wide-block month-goal-empty">${t('noWidgetsYet')}</div>`}
        ${!widgetConfig.enabled.includes('photos') ? `<div class="wide-block">${photosSectionHtml(key)}</div>` : ''}
        <div class="wide-block">
          <div class="habit-label">${t('expensesLabel')}</div>
          <div class="expense-currency-totals" id="dayExpenseTotals"></div>
          <ul class="month-expense-list" id="dayExpenseList"></ul>
          <div class="expense-add-form">
            <input type="number" id="dayExpAmount" placeholder="${t('amountPlaceholder')}" step="0.01" min="0">

            <select id="dayExpCategory"></select>
            <input type="text" id="dayExpNote" placeholder="${t('notePlaceholder')}">
            <button type="button" class="add-btn-outline" id="dayExpAddBtn">${t('addExpense')}</button>
          </div>

            <span class="hint-text">${t('currenciesInUse')}</span>
            <span id="dayExpenseCurrencyChips"></span>
            <select id="dayExpAddCurrencySelect" class="settings-select" title="${t('addCurrencyTooltip')}"></select>
            <button type="button" class="add-btn-outline" id="dayExpAddCurrencyBtn">${t('addCurrency')}</button>
          </div>

    <div class="widget-customize-link-row"><button type="button" class="back-link" id="customizeWidgetsFromDayBtn">${t('customizeWidgets')}</button></div>
  `;

  document.getElementById('backToMonthBtn').addEventListener('click', ()=> showMonthView(d.getMonth(), d.getFullYear()));
  document.getElementById('prevDateBtn').addEventListener('click', ()=> shiftDate(-1));

/* ============ PERSONALIZABLE WIDGET SYSTEM ============
   Two separate things, intentionally never merged into one object:
   - widgetConfig: WHICH widgets a user has, in what order. Persists across all days.
   - widgetDailyData: the VALUE of each generic widget, per calendar date. Enabling "Water" for
     tomorrow does not touch today's water number, because they live in different records
     (widgetDailyData[date][widgetId]), exactly like the existing mood/water/sleep already do
     via daysData[date]. Special widgets (mood/water/sleep/vibes/tasks/drawing/notes) reuse the
     EXISTING daysData/canvas storage untouched — they are not duplicated, just made optional
     and reorderable. */

const SYSTEM_WIDGETS = {
  tasks:          { id:'tasks',          labelKey:'widgetTasks',          icon:'✅', category:'Productivity' },
  notes:          { id:'notes',          labelKey:'widgetNotes',          icon:'📝', category:'Productivity' },
  dailyGoals:     { id:'dailyGoals',     labelKey:'widgetDailyGoals',     icon:'🎯', category:'Productivity', kind:'checklist' },
  mood:           { id:'mood',           labelKey:'widgetMood',           icon:'🙂', category:'Lifestyle' },
  water:          { id:'water',          labelKey:'widgetWater',          icon:'💧', category:'Lifestyle' },
  sleep:          { id:'sleep',          labelKey:'widgetSleep',          icon:'🌙', category:'Lifestyle' },
  steps:          { id:'steps',          labelKey:'widgetSteps',          icon:'👣', category:'Lifestyle', kind:'number' },
  vibes:          { id:'vibes',          labelKey:'widgetVibes',          icon:'🌈', category:'Lifestyle' },
  gratitude:      { id:'gratitude',      labelKey:'widgetGratitude',      icon:'🙏', category:'Personal', kind:'text' },
  dailyHighlight: { id:'dailyHighlight', labelKey:'widgetDailyHighlight', icon:'✨', category:'Personal', kind:'text' },
  freeText:       { id:'freeText',       labelKey:'widgetFreeText',       icon:'✏️', category:'Personal', kind:'text' },
  drawing:        { id:'drawing',        labelKey:'widgetDrawing',        icon:'🎨', category:'Personal', hidden:true },
  photos:         { id:'photos',          labelKey:'widgetPhotos',         icon:'📷', category:'Personal' },
  music:          { id:'music',          labelKey:'widgetMusic',          icon:'🎵', category:'Entertainment', kind:'text' },
  movie:          { id:'movie',          labelKey:'widgetMovie',          icon:'🎬', category:'Entertainment', kind:'text' },
  favoriteThing:  { id:'favoriteThing',  labelKey:'widgetFavoriteThing',  icon:'⭐', category:'Entertainment', kind:'text' },
};
const WIDGET_CATEGORY_ORDER = ['Productivity','Lifestyle','Personal','Entertainment'];
const WIDGET_CATEGORY_LABEL_KEYS = { Productivity:'catProductivity', Lifestyle:'catLifestyle', Personal:'catPersonal', Entertainment:'catEntertainmentGroup' };
const SPECIAL_WIDGET_IDS = ['mood','water','sleep','vibes','tasks','drawing','notes','photos']; // reuse existing daysData/canvas/photos storage as-is
const CUSTOM_WIDGET_TYPES = [
  { type:'text', labelKey:'typeText' }, { type:'checklist', labelKey:'typeChecklist' }, { type:'number', labelKey:'typeNumber' },
  { type:'counter', labelKey:'typeCounter' }, { type:'rating', labelKey:'typeRating' },
];
const MAX_SYSTEM_WIDGETS = 10;
const MAX_CUSTOM_WIDGETS = 3;

let widgetConfig = load('wp-widget-config-v1', { enabled:['mood','water','sleep','vibes','tasks','drawing','notes'], customWidgets:[] });
function saveWidgetConfig(){ save('wp-widget-config-v1', widgetConfig); }
let widgetDailyData = load('wp-widget-daily-v1', {});
function ensureWidgetDay(dateKey){ return widgetDailyData[dateKey] || (widgetDailyData[dateKey] = {}); }
function saveWidgetDaily(){ save('wp-widget-daily-v1', widgetDailyData); }

// Defensive normalization for widgetConfig, run once at load. Handles: a partially-shaped saved
// object (e.g. missing customWidgets — was crashing the Widget Library), duplicate ids in
// `enabled` (were rendering the same widget twice on the Daily Page), and orphaned ids left
// over from a deleted custom widget (were sitting in `enabled` forever, invisibly). Never
// touches widgetDailyData — no historical values are removed by this.
(function sanitizeWidgetConfig(){
  let changed = false;
  if(typeof widgetConfig !== 'object' || widgetConfig === null){
    widgetConfig = { enabled:['mood','water','sleep','vibes','tasks','drawing','notes'], customWidgets:[] };
    changed = true;
  }
  if(!Array.isArray(widgetConfig.customWidgets)){ widgetConfig.customWidgets = []; changed = true; }
  if(!Array.isArray(widgetConfig.enabled)){ widgetConfig.enabled = ['mood','water','sleep','vibes','tasks','drawing','notes']; changed = true; }
  const knownCustomIds = new Set(widgetConfig.customWidgets.map(w=> w && w.id));
  const seen = new Set();
  const cleaned = [];
  widgetConfig.enabled.forEach(id=>{
    if(typeof id !== 'string' || seen.has(id)) { changed = true; return; } // drop duplicates / bad entries
    const isKnown = !!SYSTEM_WIDGETS[id] || knownCustomIds.has(id);
    if(!isKnown){ changed = true; return; } // drop orphaned ids (e.g. a deleted custom widget)
    seen.add(id);
    cleaned.push(id);
  });
  if(cleaned.length !== widgetConfig.enabled.length) changed = true;
  widgetConfig.enabled = cleaned;
  if(typeof widgetDailyData !== 'object' || widgetDailyData === null){ widgetDailyData = {}; save('wp-widget-daily-v1', widgetDailyData); }
  if(changed) saveWidgetConfig();
})();

function getWidgetDef(widgetId){
  if(SYSTEM_WIDGETS[widgetId]) return { ...SYSTEM_WIDGETS[widgetId], label:t(SYSTEM_WIDGETS[widgetId].labelKey), isCustom:false };
  const custom = widgetConfig.customWidgets.find(w=> w.id === widgetId);
  if(custom) return { id:custom.id, label:custom.name, description:custom.description, icon:'🧩', kind:custom.type, isCustom:true };
  return null;
}
function systemWidgetCount(){ return widgetConfig.enabled.filter(id=> !!SYSTEM_WIDGETS[id]).length; }

/* ---- generic renderer: used by every widget that isn't one of the 7 "special" reused ones ---- */
function genericWidgetHtml(def, key){
  const dayVal = ensureWidgetDay(key)[def.id];
  const labelRow = `<div class="habit-label">${def.icon} ${(def.label||'').replace(/</g,'&lt;')}</div>${def.description?`<div class="widget-desc">${def.description.replace(/</g,'&lt;')}</div>`:''}`;
  if(def.kind === 'text'){
    return `<div class="wide-block">${labelRow}<textarea class="day-notes widget-text" data-widget="${def.id}" data-key="${key}" placeholder="…">${dayVal||''}</textarea></div>`;
  }
  if(def.kind === 'number'){
    const n = typeof dayVal === 'number' ? dayVal : '';
    return `<div class="day-widget-cell">${labelRow}<input type="number" class="widget-number-input" data-widget="${def.id}" data-key="${key}" value="${n}" placeholder="0"></div>`;
  }
  if(def.kind === 'counter'){
    const n = typeof dayVal === 'number' ? dayVal : 0;
    return `<div class="day-widget-cell">${labelRow}<div class="widget-counter-row">
      <button type="button" class="widget-counter-btn" data-widget="${def.id}" data-key="${key}" data-delta="-1">−</button>
      <span class="widget-counter-val" data-widget="${def.id}">${n}</span>
      <button type="button" class="widget-counter-btn" data-widget="${def.id}" data-key="${key}" data-delta="1">+</button>
    </div></div>`;
  }
  if(def.kind === 'rating'){
    const n = typeof dayVal === 'number' ? dayVal : 0;
    return `<div class="day-widget-cell">${labelRow}<div class="widget-rating-row" data-widget="${def.id}" data-key="${key}">
      ${[1,2,3,4,5].map(i=>`<button type="button" class="widget-star" data-star="${i}">${i<=n?'★':'☆'}</button>`).join('')}
    </div></div>`;
  }
  if(def.kind === 'checklist'){
    return `<div class="wide-block">${labelRow}
      <ul class="month-goals-list widget-checklist" data-widget="${def.id}" data-key="${key}"></ul>
      <div class="month-goal-add-row"><input type="text" class="widget-checklist-input"><button type="button" class="add-btn-outline widget-checklist-add" data-widget="${def.id}" data-key="${key}">${t('add')}</button></div>
    </div>`;
  }
  return '';
}
function bindGenericWidget(def, key, root){
  if(def.kind === 'text'){
    const el = root.querySelector(`.widget-text[data-widget="${def.id}"]`);
    if(el) el.addEventListener('input', e=>{ ensureWidgetDay(key)[def.id] = e.target.value; saveWidgetDaily(); });
  } else if(def.kind === 'number'){
    const el = root.querySelector(`.widget-number-input[data-widget="${def.id}"]`);
    if(el) el.addEventListener('input', e=>{ ensureWidgetDay(key)[def.id] = e.target.value===''? null : parseFloat(e.target.value); saveWidgetDaily(); });
  } else if(def.kind === 'counter'){
    root.querySelectorAll(`.widget-counter-btn[data-widget="${def.id}"]`).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const d = ensureWidgetDay(key);
        d[def.id] = Math.max(0, (typeof d[def.id]==='number'?d[def.id]:0) + parseInt(btn.dataset.delta,10));
        saveWidgetDaily();
        const out = root.querySelector(`.widget-counter-val[data-widget="${def.id}"]`); if(out) out.textContent = d[def.id];
      });
    });
  } else if(def.kind === 'rating'){
    const wrap = root.querySelector(`.widget-rating-row[data-widget="${def.id}"]`);
    if(wrap) wrap.querySelectorAll('.widget-star').forEach(star=>{
      star.addEventListener('click', ()=>{
        const n = +star.dataset.star;
        ensureWidgetDay(key)[def.id] = n; saveWidgetDaily();
        wrap.querySelectorAll('.widget-star').forEach(s=> s.textContent = (+s.dataset.star<=n?'★':'☆'));
      });
    });
  } else if(def.kind === 'checklist'){
    const list = root.querySelector(`.widget-checklist[data-widget="${def.id}"]`);
    if(!list) return;
    const addBtn = root.querySelector(`.widget-checklist-add[data-widget="${def.id}"]`);
    const input = addBtn ? addBtn.parentElement.querySelector('.widget-checklist-input') : null;
    function rerender(){
      const d = ensureWidgetDay(key);
      const items = Array.isArray(d[def.id]) ? d[def.id] : (d[def.id] = []);
      list.innerHTML = items.map(it=>`<li class="month-goal-item ${it.done?'is-done':''}">
          <button type="button" class="month-goal-check" data-item="${it.id}">${it.done?'☑':'☐'}</button>
          <span class="month-goal-title">${(it.title||'').replace(/</g,'&lt;')}</span>
          <button type="button" class="month-goal-del" data-item="${it.id}">✕</button>
        </li>`).join('') || `<li class="month-goal-empty">${t('noExpensesYet')}</li>`;
      list.querySelectorAll('.month-goal-check').forEach(b=> b.addEventListener('click', ()=>{
        const it = items.find(x=> String(x.id)===b.dataset.item); if(it){ it.done=!it.done; saveWidgetDaily(); rerender(); }
      }));
      list.querySelectorAll('.month-goal-del').forEach(b=> b.addEventListener('click', ()=>{
        const idx = items.findIndex(x=> String(x.id)===b.dataset.item); if(idx>-1){ items.splice(idx,1); saveWidgetDaily(); rerender(); }
      }));
    }
    rerender();
    if(addBtn) addBtn.addEventListener('click', ()=>{
      const text = input.value.trim(); if(!text) return;
      const d = ensureWidgetDay(key); const items = Array.isArray(d[def.id])?d[def.id]:(d[def.id]=[]);
      items.push({ id: Date.now()+Math.random(), title:text, done:false });
      input.value=''; saveWidgetDaily(); rerender();
    });
    if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') addBtn.click(); });
  }
}

/* ============ MY SPACE — customizable personal dashboard ============
   Core rule: LAYOUT and DATA never live in the same record.
   - mySpaceLayout (wp-myspace-layout-v1) only remembers WHERE each widget sits on the
     dashboard: id, x, y, w, h, order. Moving/resizing/removing a card only ever touches
     this one object.
   - Every card's actual content keeps living in whatever store it always lived in
     (daysData, photosData, expenses, monthGoals, widgetDailyData, ...). My Space cards for
     Mood/Water/Sleep/Tasks/Notes/Vibes/Photos/etc. literally call the SAME widgetBlockHtml/
     bindWidgetBlock functions the Day page uses, for today's date key — so a task you check
     off on My Space is the exact same record My Day shows, not a copy. The Goals and
     Expenses cards call the exact same renderMonthGoals/renderMonthExpenseSection functions
     the Month page uses. Removing a card from My Space (or the dashboard itself never having
     that widget) can't delete a single byte of that data — it's just not being displayed.
   This key rides the same generic save()/load() layer as everything else, so it already
   gets the same per-device localStorage + debounced Supabase sync as every other setting. */
const MYSPACE_ROW_PX = 22;   // must match .myspace-grid{ grid-auto-rows }
const MYSPACE_GAP_PX = 20;   // must match .myspace-grid{ gap }
const MYSPACE_ROW_STEP = MYSPACE_ROW_PX + MYSPACE_GAP_PX;
/* Column COUNT is itself responsive — fewer, wider columns on a narrow phone; more on
   tablet/desktop — recomputed on every render and on window resize (see the listener near
   the end of buildApp()). It's a `let`, not a `const`, specifically so every function below
   that reads it always sees the current value. */
function myspaceCurrentCols(){ return document.documentElement.clientWidth < 640 ? 2 : 4; }
let MYSPACE_COLS = myspaceCurrentCols();

/* Simple functional pastel palette — the widget owns its own color, nothing global. Reuses
   existing theme tokens (already tuned per-theme) rather than inventing new hex values. */
const MYSPACE_COLORS = { cream:'--paper2', yellow:'--gold-soft', blue:'--sky-soft', green:'--moss-soft', pink:'--bubble-soft', purple:'--plum-soft', red:'--rose-soft' };
const MYSPACE_COLOR_ORDER = ['cream','yellow','blue','green','pink','purple','red'];

/* My Day and Month are mandatory system widgets — always present on My Space, never
   removable (their remove button is hidden via .is-mandatory in CSS, and the remove handler
   refuses them too, in case the button is ever reachable some other way). They are still
   fully movable/resizable/colorable like any other widget. */
const MYSPACE_MANDATORY_IDS = ['myday','calendar'];

const MYSPACE_LAUNCHERS = {
  myday:    { id:'myday',    labelKey:'myspaceMyDay',    icon:'📔', category:'Workspaces', minW:1, minH:2, defaultW:1, defaultH:3 },
  calendar: { id:'calendar', labelKey:'myspaceCalendar', icon:'📅', category:'Workspaces', minW:1, minH:2, defaultW:1, defaultH:3 },
  mymedia:  { id:'mymedia',  labelKey:'myspaceMedia',    icon:'🖼️', category:'Workspaces', minW:1, minH:2, defaultW:2, defaultH:3 },
};
const MYSPACE_SUMMARY = {
  goals:    { id:'goals',    labelKey:'myspaceGoals',    icon:'🎯', category:'Workspaces', minW:1, minH:2, defaultW:1, defaultH:3 },
  expenses: { id:'expenses', labelKey:'myspaceExpenses', icon:'💶', category:'Workspaces', minW:1, minH:2, defaultW:1, defaultH:3 },
};
/* system/custom Day-page widgets that need a little more room because their content is a
   list/text area rather than a single stat — still compact, just not as tiny */
const MYSPACE_ROOMY_IDS = ['notes','vibes','photos','dailyGoals','freeText','gratitude','dailyHighlight'];

function mySpaceWidgetDef(id){
  if(MYSPACE_LAUNCHERS[id]){ const d = MYSPACE_LAUNCHERS[id]; return { ...d, label:t(d.labelKey) }; }
  if(MYSPACE_SUMMARY[id]){ const d = MYSPACE_SUMMARY[id]; return { ...d, label:t(d.labelKey) }; }
  if(id === 'drawing') return null; // explicitly not offered on My Space (see product spec)
  if(id === 'tasks') return { id, label:t('widgetTasks'), icon:'✅', category:'Productivity', minW:1, minH:2, defaultW:1, defaultH:3 };
  const dayDef = getWidgetDef(id);
  if(!dayDef) return null;
  const isRoomy = MYSPACE_ROOMY_IDS.includes(id) || dayDef.kind==='checklist' || dayDef.kind==='text';
  return { id, label:dayDef.label, icon:dayDef.icon, category: dayDef.isCustom ? 'Custom' : (dayDef.category||'Personal'),
    isCustom:!!dayDef.isCustom, minW:1, minH: isRoomy?3:2, defaultW: isRoomy?2:1, defaultH: isRoomy?4:3 };
}
function myspaceAllCatalogIds(){
  const ids = [...Object.keys(MYSPACE_LAUNCHERS), ...Object.keys(MYSPACE_SUMMARY)];
  Object.keys(SYSTEM_WIDGETS).forEach(id=>{ if(!SYSTEM_WIDGETS[id].hidden) ids.push(id); });
  widgetConfig.customWidgets.forEach(w=> ids.push(w.id));
  return ids;
}
function myspaceRectsOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function myspaceMaxY(widgets){ return widgets.reduce((m,w)=> Math.max(m, w.y+w.h), 0); }
function myspaceFindFreeSpot(w, h, widgets){
  w = Math.min(w, MYSPACE_COLS);
  for(let y=0; y<2000; y++){
    for(let x=0; x<=MYSPACE_COLS-w; x++){
      const rect = { x, y, w, h };
      if(!widgets.some(o=> myspaceRectsOverlap(rect, o))) return { x, y };
    }
  }
  return { x:0, y: myspaceMaxY(widgets) };
}
/* "Gravity" packing — the same technique used by every well-known drag-grid dashboard
   (Gridster, react-grid-layout, Muuri): an overlap is resolved by pushing the lower-priority
   widget DOWN, never sideways (sideways has no single well-defined answer once more than two
   widgets are involved). `fixedId`, when given, is the widget the user is actively dragging/
   resizing right now — it can push everything else out of the way, but is never itself moved
   or compacted, since its rect IS the thing the user is actively setting. */
function myspaceResolveLayout(widgets, fixedId){
  let guard = 0, changed = true;
  while(changed && guard++ < widgets.length*6){
    changed = false;
    for(const a of widgets){
      for(const b of widgets){
        if(a===b || b.id===fixedId) continue;
        if(myspaceRectsOverlap(a,b) && b.y < a.y+a.h){ b.y = a.y+a.h; changed = true; }
      }
    }
  }
  myspaceCompactUp(widgets, fixedId);
}
/* Pulls every widget (except the fixed one, if any) as far up as it can go without
   overlapping anything above it — closes gaps a widget leaves behind when it shrinks, moves
   away, or gets removed, so the layout never accumulates dead space. */
function myspaceCompactUp(widgets, fixedId){
  const sorted = widgets.slice().sort((p,q)=> p.y-q.y || p.x-q.x);
  const placed = [];
  sorted.forEach(w=>{
    if(w.id !== fixedId){
      let minY = 0;
      placed.forEach(o=>{
        const overlapsX = w.x < o.x+o.w && w.x+w.w > o.x;
        if(overlapsX) minY = Math.max(minY, o.y+o.h);
      });
      w.y = minY;
    }
    placed.push(w);
  });
}
function myspaceDefaultLayout(ids){
  // ids defaults to the generic starter set; onboarding (see onbFinish()) passes the
  // mandatory launchers plus whatever the user actually picked, so a fresh account's My
  // Space reflects their onboarding choices instead of always shipping this fixed list.
  if(!ids) ids = ['myday','calendar','mood','water','sleep','tasks','goals','expenses','mymedia'];
  const widgets = [];
  ids.forEach((id,i)=>{
    const def = mySpaceWidgetDef(id);
    if(!def) return;
    const w = Math.min(def.defaultW||1, MYSPACE_COLS), h = def.defaultH||3;
    const spot = myspaceFindFreeSpot(w, h, widgets);
    widgets.push({ id, x:spot.x, y:spot.y, w, h, order:i, color:'cream' });
  });
  myspaceCompactUp(widgets, null);
  return { widgets };
}

let mySpaceLayout = load('wp-myspace-layout-v1', null);
function saveMySpaceLayout(){ save('wp-myspace-layout-v1', mySpaceLayout); }
/* Defensive normalization, run once at load — same treatment as sanitizeWidgetConfig above.
   Drops orphaned ids (e.g. a custom widget deleted from another device before this layout
   synced), clamps sizes/positions into range, guarantees the two mandatory widgets are
   present, and resolves any overlap a corrupted/foreign save might contain. Never touches
   any widget's actual data. */
(function sanitizeMySpaceLayout(){
  if(!mySpaceLayout || typeof mySpaceLayout !== 'object' || !Array.isArray(mySpaceLayout.widgets)){
    mySpaceLayout = myspaceDefaultLayout();
    saveMySpaceLayout();
    return;
  }
  const seen = new Set();
  const cleaned = [];
  mySpaceLayout.widgets.forEach(w=>{
    if(!w || typeof w.id !== 'string' || seen.has(w.id)) return;
    const def = mySpaceWidgetDef(w.id);
    if(!def) return;
    seen.add(w.id);
    const minW = def.minW||1, minH = def.minH||2;
    const ww = Math.max(minW, Math.min(MYSPACE_COLS, Math.round(w.w)||def.defaultW||1));
    const hh = Math.max(minH, Math.round(w.h)||def.defaultH||3);
    const xx = Math.max(0, Math.min(MYSPACE_COLS-ww, Math.round(w.x)||0));
    const yy = Math.max(0, Math.round(w.y)||0);
    const color = MYSPACE_COLORS[w.color] ? w.color : 'cream';
    cleaned.push({ id:w.id, x:xx, y:yy, w:ww, h:hh, color, order: typeof w.order==='number'?w.order:cleaned.length });
  });
  MYSPACE_MANDATORY_IDS.forEach(id=>{
    if(cleaned.some(w=> w.id===id)) return;
    const def = mySpaceWidgetDef(id);
    const w = Math.min(def.defaultW||1, MYSPACE_COLS), h = def.defaultH||3;
    const spot = myspaceFindFreeSpot(w, h, cleaned);
    cleaned.unshift({ id, x:spot.x, y:spot.y, w, h, color:'cream', order:-1 });
  });
  cleaned.sort((a,b)=> a.order-b.order);
  cleaned.forEach((w,i)=> w.order = i);
  myspaceResolveLayout(cleaned, null);
  mySpaceLayout = { widgets: cleaned };
})();

function myspaceCurrentMonthKey(){ return monthKeyOf(todayReal.getMonth(), APP_YEAR); }

/* ---- per-widget card body: reuse existing render/bind functions wherever one already exists.
   Per the "less on the dashboard, more inside the widget" rule, My Day/Calendar/Media/Goals/
   Expenses/Tasks all get a compact SUMMARY view here — a one-or-two-line glance plus an
   "Open →" that leads to the exact same full-featured page/record. Everything else (Mood,
   Water, Sleep, Notes, Photos, custom widgets, ...) reuses the Day-page's own render/bind
   functions as-is, since their normal content is already small. ---- */
function myspaceCardBodyHtml(id){
  if(id === 'myday') return myspaceMyDayHtml();
  if(id === 'calendar') return myspaceCalendarHtml();
  if(id === 'mymedia') return myspaceMediaHtml();
  if(id === 'goals') return myspaceGoalsHtml();
  if(id === 'expenses') return myspaceExpensesHtml();
  if(id === 'tasks') return myspaceTasksHtml();
  const key = dateKeyOf(todayReal);
  const dd = ensureDayData(key);
  return widgetBlockHtml(id, key, dd) || '';
}
function myspaceBindCard(id, root){
  if(id === 'myday') return bindMyspaceMyDay(root);
  if(id === 'calendar') return bindMyspaceCalendar(root);
  if(id === 'mymedia') return bindMyspaceMedia(root);
  if(id === 'goals') return bindMyspaceGoals(root);
  if(id === 'expenses') return bindMyspaceExpenses(root);
  if(id === 'tasks') return bindMyspaceTasks(root);
  const key = dateKeyOf(todayReal);
  bindWidgetBlock(id, key, root);
}

  const dd = ensureDayData(key);
  const done = dd.todos.filter(x=>x.done).length, total = dd.todos.length;
  return `<div class="myspace-card-head">
      <span class="myspace-card-title">${MYSPACE_LAUNCHERS.myday.icon} ${t('myspaceMyDay')}</span>
      <button type="button" class="myspace-open-btn" data-open="myday">${t('myspaceOpen')} →</button>

      <div class="myspace-mini-row"><span class="mood-face" style="font-size:26px;">${MOOD_FACES[dd.mood]}</span>
        <span>${total ? t('myspaceTasksDone',{done,total}) : t('myspaceNoTasks')}</span></div>
    </div>`;
}
