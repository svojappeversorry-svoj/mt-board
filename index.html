function bindTasksWidget(key, root){
  const addBtn = root.querySelector('.todo-add-btn'); if(!addBtn) return;
  renderTodos(key);
  addBtn.addEventListener('click', ()=> addTodo(key, root));
  root.querySelector('.todo-input').addEventListener('keydown', e=>{ if(e.key === 'Enter') addTodo(key, root); });
  const moodBtn = root.querySelector('.task-mood-btn');
  moodBtn.addEventListener('click', ()=> root.querySelector('#moodPicker-'+key).classList.toggle('open'));
  root.querySelectorAll('.mood-opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const m = TASK_MOODS[+btn.dataset.i];
      moodBtn.textContent = m.emoji; moodBtn.title = t('taskMoodTooltipWithLabel', { label:t(m.labelKey) }); moodBtn.dataset.chosenEmoji = m.emoji;
      root.querySelector('#moodPicker-'+key).classList.remove('open');
    });
  });
}
function bindWidgetBlock(widgetId, key, root){
  if(widgetId === 'mood') bindMoodWidget(key, root);
  else if(widgetId === 'water') bindWaterWidget(key, root);
  else if(widgetId === 'sleep') bindSleepWidget(key, root);
  else if(widgetId === 'vibes') bindVibesWidget(key, root);
  else if(widgetId === 'tasks') bindTasksWidget(key, root);
  else if(widgetId === 'notes') bindNotesWidget(key, root);
  else if(widgetId === 'photos') bindPhotosSection(key, root);
  else { const def = getWidgetDef(widgetId); if(def) bindGenericWidget(def, key, root); }
}

/* ============ PERSONALIZABLE WIDGET SYSTEM ============
   Two separate things, intentionally never merged into one object:
   - widgetConfig: WHICH widgets a user has, in what order. Persists across all days.
   - widgetDailyData: the VALUE of each generic widget, per calendar date. Enabling "Water" for
     tomorrow does not touch today's water number, because they live in different records
     (widgetDailyData[date][widgetId]), exactly like the existing mood/water/sleep already do
     via daysData[date]. Special widgets (mood/water/sleep/vibes/tasks/drawing/notes) reuse the
     EXISTING daysData/canvas storage untouched — they are not duplicated, just made optional

const MAX_CUSTOM_WIDGETS = 3;

let widgetConfig = load('wp-widget-config-v1', { enabled:['mood','water','sleep','vibes','tasks','notes'], customWidgets:[] });
function saveWidgetConfig(){ save('wp-widget-config-v1', widgetConfig); }
let widgetDailyData = load('wp-widget-daily-v1', {});
function ensureWidgetDay(dateKey){ return widgetDailyData[dateKey] || (widgetDailyData[dateKey] = {}); }
function saveWidgetDaily(){ save('wp-widget-daily-v1', widgetDailyData); }

// Defensive normalization for widgetConfig, run once at load. Handles: a partially-shaped saved
// object (e.g. missing customWidgets — was crashing the Widget Library), duplicate ids in
// `enabled` (were rendering the same widget twice on the Daily Page), and orphaned ids left
// over from a deleted custom widget (were sitting in `enabled` forever, invisibly). Never
// touches widgetDailyData — no historical values are removed by this.
(function sanitizeWidgetConfig(){
  let changed = false;
  if(typeof widgetConfig !== 'object' || widgetConfig === null){
    widgetConfig = { enabled:['mood','water','sleep','vibes','tasks','notes'], customWidgets:[] };
    changed = true;
  }
  if(!Array.isArray(widgetConfig.customWidgets)){ widgetConfig.customWidgets = []; changed = true; }
  if(!Array.isArray(widgetConfig.enabled)){ widgetConfig.enabled = ['mood','water','sleep','vibes','tasks','notes']; changed = true; }
  const knownCustomIds = new Set(widgetConfig.customWidgets.map(w=> w && w.id));
  const seen = new Set();
  const cleaned = [];
  widgetConfig.enabled.forEach(id=>{
    if(typeof id !== 'string' || seen.has(id)) { changed = true; return; } // drop duplicates / bad entries
    const isKnown = !!SYSTEM_WIDGETS[id] || knownCustomIds.has(id);
    if(!isKnown){ changed = true; return; } // drop orphaned ids (e.g. a deleted custom widget)
    seen.add(id);
    cleaned.push(id);
  });
  if(cleaned.length !== widgetConfig.enabled.length) changed = true;
  widgetConfig.enabled = cleaned;
  if(typeof widgetDailyData !== 'object' || widgetDailyData === null){ widgetDailyData = {}; save('wp-widget-daily-v1', widgetDailyData); }
  if(changed) saveWidgetConfig();
})();

/* Digital Chrome's own curated icon vocabulary — sci-fi/chrome objects instead of the
   universal set, applied only where My Day's energy/lifestyle widgets read visibly "off-theme"
   (a rainbow, a target, a pencil...). Other themes keep the original SYSTEM_WIDGETS icons
   untouched; a future theme can add its own map the same way without disturbing this one. */
const BERRY_WIDGET_ICONS = { tasks:'🛰️', mood:'🌙', water:'🔷', vibes:'🪩', gratitude:'💜', steps:'🚀', freeText:'🔹' };
function widgetIcon(id){
  const base = SYSTEM_WIDGETS[id] ? SYSTEM_WIDGETS[id].icon : '🧩';
  return (currentTheme==='berry' && BERRY_WIDGET_ICONS[id]) ? BERRY_WIDGET_ICONS[id] : base;
}
function getWidgetDef(widgetId){
  if(SYSTEM_WIDGETS[widgetId]) return { ...SYSTEM_WIDGETS[widgetId], label:t(SYSTEM_WIDGETS[widgetId].labelKey), icon:widgetIcon(widgetId), isCustom:false };
  const custom = widgetConfig.customWidgets.find(w=> w.id === widgetId);
  if(custom) return { id:custom.id, label:custom.name, description:custom.description, icon:'🧩', kind:custom.type, isCustom:true };
  return null;
}
function systemWidgetCount(){ return widgetConfig.enabled.filter(id=> !!SYSTEM_WIDGETS[id]).length; }

/* ---- generic renderer: used by every widget that isn't one of the 7 "special" reused ones ---- */
function genericWidgetHtml(def, key){
  const dayVal = ensureWidgetDay(key)[def.id];
  const labelRow = `<div class="habit-label">${def.icon} ${(def.label||'').replace(/</g,'&lt;')}</div>${def.description?`<div class="widget-desc">${def.description.replace(/</g,'&lt;')}</div>`:''}`;
  if(def.kind === 'text'){
    return `<div class="wide-block">${labelRow}<textarea class="day-notes widget-text" data-widget="${def.id}" data-key="${key}" placeholder="…">${dayVal||''}</textarea></div>`;
  }
  if(def.kind === 'number'){
    const n = typeof dayVal === 'number' ? dayVal : '';
    return `<div class="day-widget-cell">${labelRow}<input type="number" class="widget-number-input" data-widget="${def.id}" data-key="${key}" value="${n}" placeholder="0"></div>`;
  }
  if(def.kind === 'counter'){
    const n = typeof dayVal === 'number' ? dayVal : 0;
    return `<div class="day-widget-cell">${labelRow}<div class="widget-counter-row">
      <button type="button" class="widget-counter-btn" data-widget="${def.id}" data-key="${key}" data-delta="-1">−</button>
      <span class="widget-counter-val" data-widget="${def.id}">${n}</span>
      <button type="button" class="widget-counter-btn" data-widget="${def.id}" data-key="${key}" data-delta="1">+</button>
    </div></div>`;
  }
  if(def.kind === 'rating'){
    const n = typeof dayVal === 'number' ? dayVal : 0;
    return `<div class="day-widget-cell">${labelRow}<div class="widget-rating-row" data-widget="${def.id}" data-key="${key}">
      ${[1,2,3,4,5].map(i=>`<button type="button" class="widget-star" data-star="${i}">${i<=n?'★':'☆'}</button>`).join('')}
    </div></div>`;
  }
  if(def.kind === 'checklist'){
    return `<div class="wide-block">${labelRow}
      <ul class="month-goals-list widget-checklist" data-widget="${def.id}" data-key="${key}"></ul>
      <div class="month-goal-add-row"><input type="text" class="widget-checklist-input"><button type="button" class="add-btn-outline widget-checklist-add" data-widget="${def.id}" data-key="${key}">${t('add')}</button></div>
    </div>`;
  }
  return '';
}
function bindGenericWidget(def, key, root){
  if(def.kind === 'text'){
    const el = root.querySelector(`.widget-text[data-widget="${def.id}"]`);
    if(el) el.addEventListener('input', e=>{ ensureWidgetDay(key)[def.id] = e.target.value; saveWidgetDaily(); });
  } else if(def.kind === 'number'){
    const el = root.querySelector(`.widget-number-input[data-widget="${def.id}"]`);
    if(el) el.addEventListener('input', e=>{ ensureWidgetDay(key)[def.id] = e.target.value===''? null : parseFloat(e.target.value); saveWidgetDaily(); });
  } else if(def.kind === 'counter'){
    root.querySelectorAll(`.widget-counter-btn[data-widget="${def.id}"]`).forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const d = ensureWidgetDay(key);
        d[def.id] = Math.max(0, (typeof d[def.id]==='number'?d[def.id]:0) + parseInt(btn.dataset.delta,10));
        saveWidgetDaily();
        const out = root.querySelector(`.widget-counter-val[data-widget="${def.id}"]`); if(out) out.textContent = d[def.id];
      });
    });
  } else if(def.kind === 'rating'){
    const wrap = root.querySelector(`.widget-rating-row[data-widget="${def.id}"]`);
    if(wrap) wrap.querySelectorAll('.widget-star').forEach(star=>{
      star.addEventListener('click', ()=>{
        const n = +star.dataset.star;
        ensureWidgetDay(key)[def.id] = n; saveWidgetDaily();
        wrap.querySelectorAll('.widget-star').forEach(s=> s.textContent = (+s.dataset.star<=n?'★':'☆'));
      });
    });
  } else if(def.kind === 'checklist'){
    const list = root.querySelector(`.widget-checklist[data-widget="${def.id}"]`);
    if(!list) return;
    const addBtn = root.querySelector(`.widget-checklist-add[data-widget="${def.id}"]`);
    const input = addBtn ? addBtn.parentElement.querySelector('.widget-checklist-input') : null;
    function rerender(){
      const d = ensureWidgetDay(key);
      const items = Array.isArray(d[def.id]) ? d[def.id] : (d[def.id] = []);
      list.innerHTML = items.map(it=>`<li class="month-goal-item ${it.done?'is-done':''}">
          <button type="button" class="month-goal-check" data-item="${it.id}">${it.done?'☑':'☐'}</button>
          <span class="month-goal-title">${(it.title||'').replace(/</g,'&lt;')}</span>
          <button type="button" class="month-goal-del" data-item="${it.id}">✕</button>
        </li>`).join('') || `<li class="month-goal-empty">${t('noExpensesYet')}</li>`;
      list.querySelectorAll('.month-goal-check').forEach(b=> b.addEventListener('click', ()=>{
        const it = items.find(x=> String(x.id)===b.dataset.item); if(it){ it.done=!it.done; saveWidgetDaily(); rerender(); }
      }));
      list.querySelectorAll('.month-goal-del').forEach(b=> b.addEventListener('click', ()=>{
        const idx = items.findIndex(x=> String(x.id)===b.dataset.item); if(idx>-1){ items.splice(idx,1); saveWidgetDaily(); rerender(); }
      }));
    }
    rerender();
    if(addBtn) addBtn.addEventListener('click', ()=>{
      const text = input.value.trim(); if(!text) return;
      const d = ensureWidgetDay(key); const items = Array.isArray(d[def.id])?d[def.id]:(d[def.id]=[]);
      items.push({ id: Date.now()+Math.random(), title:text, done:false });
      input.value=''; saveWidgetDaily(); rerender();
    });
    if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter') addBtn.click(); });
  }
}

/* ============ MY SPACE — customizable personal dashboard ============
   Core rule: LAYOUT and DATA never live in the same record.
   - mySpaceLayout (wp-myspace-layout-v1) only remembers WHERE each widget sits on the
     dashboard: id, x, y, w, h, order. Moving/resizing/removing a card only ever touches
     this one object.
   - Every card's actual content keeps living in whatever store it always lived in
     (daysData, photosData, expenses, monthGoals, widgetDailyData, ...). My Space cards for
     Mood/Water/Sleep/Tasks/Notes/Vibes/Photos/etc. literally call the SAME widgetBlockHtml/
     bindWidgetBlock functions the Day page uses, for today's date key — so a task you check
     off on My Space is the exact same record My Day shows, not a copy. The Goals and
     Expenses cards call the exact same renderMonthGoals/renderMonthExpenseSection functions
     the Month page uses. Removing a card from My Space (or the dashboard itself never having
     that widget) can't delete a single byte of that data — it's just not being displayed.
   This key rides the same generic save()/load() layer as everything else, so it already
   gets the same per-device localStorage + debounced Supabase sync as every other setting. */
const MYSPACE_ROW_PX = 22;   // must match .myspace-grid{ grid-auto-rows }
const MYSPACE_GAP_PX = 20;   // must match .myspace-grid{ gap }
const MYSPACE_ROW_STEP = MYSPACE_ROW_PX + MYSPACE_GAP_PX;
/* Column COUNT is itself responsive — fewer, wider columns on a narrow phone; more on
   tablet/desktop — recomputed on every render and on window resize (see the listener near
   the end of buildApp()). It's a `let`, not a `const`, specifically so every function below
   that reads it always sees the current value. */
function myspaceCurrentCols(){ return document.documentElement.clientWidth < 640 ? 2 : 4; }
let MYSPACE_COLS = myspaceCurrentCols();

/* Simple functional pastel palette — the widget owns its own color, nothing global. Reuses
   existing theme tokens (already tuned per-theme) rather than inventing new hex values. */
const MYSPACE_COLORS = { cream:'--paper2', yellow:'--gold-soft', blue:'--sky-soft', green:'--moss-soft', pink:'--bubble-soft', purple:'--plum-soft', red:'--rose-soft' };
const MYSPACE_COLOR_ORDER = ['cream','yellow','blue','green','pink','purple','red'];

/* My Day and Month are mandatory system widgets — always present on My Space, never
   removable (their remove button is hidden via .is-mandatory in CSS, and the remove handler
   refuses them too, in case the button is ever reachable some other way). They are still
   fully movable/resizable/colorable like any other widget. */
const MYSPACE_MANDATORY_IDS = ['myday','calendar'];

const MYSPACE_LAUNCHERS = {
  myday:    { id:'myday',    labelKey:'myspaceMyDay',    icon:'📔', category:'Workspaces', minW:1, minH:2, defaultW:1, defaultH:3 },
  calendar: { id:'calendar', labelKey:'myspaceCalendar', icon:'📅', category:'Workspaces', minW:1, minH:2, defaultW:1, defaultH:3 },
  mymedia:  { id:'mymedia',  labelKey:'myspaceMedia',    icon:'🖼️', category:'Workspaces', minW:1, minH:2, defaultW:2, defaultH:3 },
};
const MYSPACE_SUMMARY = {
  goals:    { id:'goals',    labelKey:'myspaceGoals',    icon:'🎯', category:'Workspaces', minW:1, minH:2, defaultW:1, defaultH:3 },
  expenses: { id:'expenses', labelKey:'myspaceExpenses', icon:'💶', category:'Workspaces', minW:1, minH:2, defaultW:1, defaultH:3 },
};
/* system/custom Day-page widgets that need a little more room because their content is a
   list/text area rather than a single stat — still compact, just not as tiny */
const MYSPACE_ROOMY_IDS = ['notes','vibes','photos','freeText','gratitude','dailyHighlight'];

function mySpaceWidgetDef(id){
  if(MYSPACE_LAUNCHERS[id]){ const d = MYSPACE_LAUNCHERS[id]; return { ...d, label:t(d.labelKey) }; }
  if(MYSPACE_SUMMARY[id]){ const d = MYSPACE_SUMMARY[id]; return { ...d, label:t(d.labelKey) }; }
  if(id === 'tasks') return { id, label:t('widgetTasks'), icon:widgetIcon('tasks'), category:'Productivity', minW:1, minH:2, defaultW:1, defaultH:3 };
  const dayDef = getWidgetDef(id);
  if(!dayDef) return null;
  const isRoomy = MYSPACE_ROOMY_IDS.includes(id) || dayDef.kind==='checklist' || dayDef.kind==='text';
  return { id, label:dayDef.label, icon:dayDef.icon, category: dayDef.isCustom ? 'Custom' : (dayDef.category||'Personal'),
    isCustom:!!dayDef.isCustom, minW:1, minH: isRoomy?3:2, defaultW: isRoomy?2:1, defaultH: isRoomy?4:3 };
}
function myspaceAllCatalogIds(){
  const ids = [...Object.keys(MYSPACE_LAUNCHERS), ...Object.keys(MYSPACE_SUMMARY)];
  Object.keys(SYSTEM_WIDGETS).forEach(id=>{ if(!SYSTEM_WIDGETS[id].hidden) ids.push(id); });
  widgetConfig.customWidgets.forEach(w=> ids.push(w.id));
  return ids;
}
function myspaceRectsOverlap(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; }
function myspaceMaxY(widgets){ return widgets.reduce((m,w)=> Math.max(m, w.y+w.h), 0); }
function myspaceFindFreeSpot(w, h, widgets){
  w = Math.min(w, MYSPACE_COLS);
  for(let y=0; y<2000; y++){
    for(let x=0; x<=MYSPACE_COLS-w; x++){
      const rect = { x, y, w, h };
      if(!widgets.some(o=> myspaceRectsOverlap(rect, o))) return { x, y };
    }
  }
  return { x:0, y: myspaceMaxY(widgets) };
}
/* "Gravity" packing — the same technique used by every well-known drag-grid dashboard
   (Gridster, react-grid-layout, Muuri): an overlap is resolved by pushing the lower-priority
   widget DOWN, never sideways (sideways has no single well-defined answer once more than two
   widgets are involved). `fixedId`, when given, is the widget the user is actively dragging/
   resizing right now — it can push everything else out of the way, but is never itself moved
   or compacted, since its rect IS the thing the user is actively setting. */
function myspaceResolveLayout(widgets, fixedId){
  let guard = 0, changed = true;
  while(changed && guard++ < widgets.length*6){
    changed = false;
    for(const a of widgets){
      for(const b of widgets){
        if(a===b || b.id===fixedId) continue;
        if(myspaceRectsOverlap(a,b) && b.y < a.y+a.h){ b.y = a.y+a.h; changed = true; }
      }
    }
  }
  myspaceCompactUp(widgets, fixedId);
}
/* Pulls every widget (except the fixed one, if any) as far up as it can go without
   overlapping anything above it — closes gaps a widget leaves behind when it shrinks, moves
   away, or gets removed, so the layout never accumulates dead space. */
function myspaceCompactUp(widgets, fixedId){
  const sorted = widgets.slice().sort((p,q)=> p.y-q.y || p.x-q.x);
  const placed = [];
  sorted.forEach(w=>{
    if(w.id !== fixedId){
      let minY = 0;
      placed.forEach(o=>{
        const overlapsX = w.x < o.x+o.w && w.x+w.w > o.x;
        if(overlapsX) minY = Math.max(minY, o.y+o.h);
      });
      w.y = minY;
    }
    placed.push(w);
  });
}
function myspaceDefaultLayout(ids){
  // ids defaults to the generic starter set; onboarding (see onbFinish()) passes the
  // mandatory launchers plus whatever the user actually picked, so a fresh account's My
  // Space reflects their onboarding choices instead of always shipping this fixed list.
  if(!ids) ids = ['myday','calendar','mood','water','sleep','tasks','goals','expenses','mymedia'];
  const widgets = [];
  ids.forEach((id,i)=>{
    const def = mySpaceWidgetDef(id);
    if(!def) return;
    const w = Math.min(def.defaultW||1, MYSPACE_COLS), h = def.defaultH||3;
    const spot = myspaceFindFreeSpot(w, h, widgets);
    widgets.push({ id, x:spot.x, y:spot.y, w, h, order:i, color:'cream' });
  });
  myspaceCompactUp(widgets, null);
  return { widgets };
}

let mySpaceLayout = load('wp-myspace-layout-v1', null);
function saveMySpaceLayout(){ save('wp-myspace-layout-v1', mySpaceLayout); }
/* Defensive normalization, run once at load — same treatment as sanitizeWidgetConfig above.
   Drops orphaned ids (e.g. a custom widget deleted from another device before this layout
   synced), clamps sizes/positions into range, guarantees the two mandatory widgets are
   present, and resolves any overlap a corrupted/foreign save might contain. Never touches
   any widget's actual data. */
(function sanitizeMySpaceLayout(){
  if(!mySpaceLayout || typeof mySpaceLayout !== 'object' || !Array.isArray(mySpaceLayout.widgets)){
    mySpaceLayout = myspaceDefaultLayout();
    saveMySpaceLayout();
    return;
  }
  const seen = new Set();
  const cleaned = [];
  mySpaceLayout.widgets.forEach(w=>{
    if(!w || typeof w.id !== 'string' || seen.has(w.id)) return;
    const def = mySpaceWidgetDef(w.id);
    if(!def) return;
    seen.add(w.id);
    const minW = def.minW||1, minH = def.minH||2;
    const ww = Math.max(minW, Math.min(MYSPACE_COLS, Math.round(w.w)||def.defaultW||1));
    const hh = Math.max(minH, Math.round(w.h)||def.defaultH||3);
    const xx = Math.max(0, Math.min(MYSPACE_COLS-ww, Math.round(w.x)||0));
    const yy = Math.max(0, Math.round(w.y)||0);
    const color = MYSPACE_COLORS[w.color] ? w.color : 'cream';
    cleaned.push({ id:w.id, x:xx, y:yy, w:ww, h:hh, color, order: typeof w.order==='number'?w.order:cleaned.length });
  });
  MYSPACE_MANDATORY_IDS.forEach(id=>{
    if(cleaned.some(w=> w.id===id)) return;
    const def = mySpaceWidgetDef(id);
    const w = Math.min(def.defaultW||1, MYSPACE_COLS), h = def.defaultH||3;
    const spot = myspaceFindFreeSpot(w, h, cleaned);
    cleaned.unshift({ id, x:spot.x, y:spot.y, w, h, color:'cream', order:-1 });
  });
  cleaned.sort((a,b)=> a.order-b.order);
  cleaned.forEach((w,i)=> w.order = i);
  myspaceResolveLayout(cleaned, null);
  mySpaceLayout = { widgets: cleaned };
})();

function myspaceCurrentMonthKey(){ return monthKeyOf(todayReal.getMonth(), APP_YEAR); }

/* ---- per-widget card body: reuse existing render/bind functions wherever one already exists.
   Per the "less on the dashboard, more inside the widget" rule, My Day/Calendar/Media/Goals/
   Expenses/Tasks all get a compact SUMMARY view here — a one-or-two-line glance plus an
   "Open →" that leads to the exact same full-featured page/record. Everything else (Mood,
   Water, Sleep, Notes, Photos, custom widgets, ...) reuses the Day-page's own render/bind
   functions as-is, since their normal content is already small. ---- */
function myspaceCardBodyHtml(id){
  if(id === 'myday') return myspaceMyDayHtml();
  if(id === 'calendar') return myspaceCalendarHtml();
  if(id === 'mymedia') return myspaceMediaHtml();
  if(id === 'goals') return myspaceGoalsHtml();
  if(id === 'expenses') return myspaceExpensesHtml();
  if(id === 'tasks') return myspaceTasksHtml();
  if(id === 'water') return myspaceWaterHtml();
  const key = dateKeyOf(todayReal);
  const dd = ensureDayData(key);
  return widgetBlockHtml(id, key, dd) || '';
}
function myspaceBindCard(id, root){
  if(id === 'myday') return bindMyspaceMyDay(root);
  if(id === 'calendar') return bindMyspaceCalendar(root);
  if(id === 'mymedia') return bindMyspaceMedia(root);
  if(id === 'goals') return bindMyspaceGoals(root);
  if(id === 'expenses') return bindMyspaceExpenses(root);
  if(id === 'tasks') return bindMyspaceTasks(root);
  if(id === 'water') return bindMyspaceWater(root);
  const key = dateKeyOf(todayReal);
  bindWidgetBlock(id, key, root);
}

function myspaceMyDayHtml(){
  const key = dateKeyOf(todayReal);
  const dd = ensureDayData(key);
  const done = dd.todos.filter(x=>x.done).length, total = dd.todos.length;
  return `<div class="myspace-card-head">
      <span class="myspace-card-title">${MYSPACE_LAUNCHERS.myday.icon} ${t('myspaceMyDay')}</span>
      <button type="button" class="myspace-open-btn" data-open="myday">${t('myspaceOpen')} →</button>
    </div>
    <div class="myspace-mini-day" data-open="myday">
      <div class="myspace-mini-date">${weekdayFullName(todayReal)}, ${fmtShort(todayReal)}</div>
      <div class="myspace-mini-row"><span class="mood-face" style="font-size:26px;">${moodFace(dd.mood)}</span>
        <span>${total ? t('myspaceTasksDone',{done,total}) : t('myspaceNoTasks')}</span></div>
    </div>`;
}
function bindMyspaceMyDay(root){
  root.querySelectorAll('[data-open="myday"]').forEach(el=> el.addEventListener('click', ()=> showDateView(todayReal)));
}
function myspaceCalendarHtml(){
  return `<div class="myspace-card-head">
      <span class="myspace-card-title">${MYSPACE_LAUNCHERS.calendar.icon} ${t('myspaceCalendar')}</span>
      <button type="button" class="myspace-open-btn" data-open="calendar">${t('myspaceOpen')} →</button>
    </div>
    <div class="myspace-mini-cal" data-open="calendar">
      <div class="myspace-mini-month">${monthFullName(todayReal.getMonth(), APP_YEAR)} ${APP_YEAR}</div>
      <div class="myspace-mini-today">${t('now')}: ${fmtFull(todayReal)}</div>
    </div>`;
}
function bindMyspaceCalendar(root){
  root.querySelectorAll('[data-open="calendar"]').forEach(el=> el.addEventListener('click', ()=> showMonthView(todayReal.getMonth(), APP_YEAR)));
}
function myspaceMediaHtml(){
  const keys = allPhotoDateKeys().slice(-3).reverse();
  const recent = [];
  keys.forEach(k=> photosData[k].forEach(p=> recent.push(p)));
  const shown = recent.slice(0,3);
  return `<div class="myspace-card-head">
      <span class="myspace-card-title">${MYSPACE_LAUNCHERS.mymedia.icon} ${t('myspaceMedia')}</span>
      <button type="button" class="myspace-open-btn" data-open="mymedia">${t('myspaceOpen')} →</button>
    </div>
    ${shown.length ? `<div class="photo-thumb-row">${shown.map(p=>`<div class="photo-thumb-wrap"><img class="photo-thumb" src="${p.src}" data-view-date="${p.date}" data-view-id="${p.id}" alt=""></div>`).join('')}</div>`
      : `<div class="myspace-mini-row">${t('noPhotosYet')}</div>`}`;
}
function bindMyspaceMedia(root){
  root.querySelectorAll('[data-open="mymedia"]').forEach(el=> el.addEventListener('click', showMediaView));
  root.querySelectorAll('.photo-thumb[data-view-id]').forEach(img=> img.addEventListener('click', (e)=>{
    e.stopPropagation();
    openPhotoViewer(img.dataset.viewDate, img.dataset.viewId);
  }));
}
/* Goals/Expenses/Tasks: quick-glance summary only, reading the exact same records the Month
   and Day pages already own (wp-month-goals-v1-*, expenses, daysData) — no separate data, no
   inline add-forms here. Full add/edit/list stays on the page "Open →" leads to. */
function myspaceGoalsHtml(){
  currentMonthKey = myspaceCurrentMonthKey();
  const goals = load('wp-month-goals-v1-'+currentMonthKey, []);
  const done = goals.filter(g=> g.done).length;
  return `<div class="myspace-card-head">

/* Layout persists across breakpoints/devices, but a column count that was valid on a MacBook
   might not fit on a phone — re-clamp width/x into the CURRENT column count and re-resolve
   before every render, so the board is always valid no matter which device rendered it last. */
function myspaceReclampForCols(){
  mySpaceLayout.widgets.forEach(w=>{
    const def = mySpaceWidgetDef(w.id);
    const minW = (def && def.minW) || 1;
    w.w = Math.max(minW, Math.min(MYSPACE_COLS, w.w));
    w.x = Math.max(0, Math.min(MYSPACE_COLS-w.w, w.x));
  });
  myspaceResolveLayout(mySpaceLayout.widgets, null);
}
/* FLIP animation (First-Last-Invert-Play): capture where every OTHER card currently sits,
   apply the new layout instantly, then re-play the visual difference as a short eased
   transform transition, so displaced widgets visibly SLIDE into their new spot instead of
   teleporting. The actively-dragged/resized card is excluded — it keeps following the
   pointer directly via its own transform, updated separately on every move event. */
function myspaceFlipCards(cards, firstRects){
  cards.forEach(c=>{
    const first = firstRects.get(c);
    if(!first) return;
    const last = c.getBoundingClientRect();
    const dx = first.left-last.left, dy = first.top-last.top;
    if(Math.abs(dx)>0.5 || Math.abs(dy)>0.5){
      c.style.transition = 'none';
      c.style.transform = `translate(${dx}px, ${dy}px)`;
      c.getBoundingClientRect(); // force layout so the starting transform commits before animating away
      requestAnimationFrame(()=>{
        c.style.transition = 'transform 190ms ease';
        c.style.transform = '';
      });
    }
  });
}
function myspaceReflowAndAnimate(grid, fixedId){
  const cards = Array.from(grid.querySelectorAll('.myspace-card')).filter(c=> c.dataset.wid !== fixedId);
  const firstRects = new Map(cards.map(c=> [c, c.getBoundingClientRect()]));
  myspaceResolveLayout(mySpaceLayout.widgets, fixedId);
  cards.forEach(c=>{
    const w = mySpaceLayout.widgets.find(x=> x.id===c.dataset.wid);
    if(!w) return;
    c.style.setProperty('--gcs', w.x+1);
    c.style.setProperty('--gcw', w.w);
    c.style.setProperty('--grs', w.y+1);
    c.style.setProperty('--grh', w.h);
  });
  myspaceFlipCards(cards, firstRects);
}
/* Same FLIP technique wrapped around a full buildMySpaceView() rebuild — used for actions
   that aren't a live drag (add / remove / Edit toggle), so the whole board animates into its
   new arrangement instead of jumping. */
function myspaceAnimatedRebuild(){
  const grid = document.getElementById('mySpaceGrid');
  if(!grid){ buildMySpaceView(); return; }
  const firstRects = new Map();
  grid.querySelectorAll('.myspace-card').forEach(c=> firstRects.set(c.dataset.wid, c.getBoundingClientRect()));
  buildMySpaceView();
  const newGrid = document.getElementById('mySpaceGrid');
  if(!newGrid) return;
  const byWid = new Map();
  newGrid.querySelectorAll('.myspace-card').forEach(c=>{
    const first = firstRects.get(c.dataset.wid);
    if(first) byWid.set(c, first);
  });
  myspaceFlipCards(Array.from(byWid.keys()), byWid);
}
function myspaceBindEditHandlers(root){
  const grid = root.querySelector('#mySpaceGrid');
  grid.querySelectorAll('.myspace-remove-btn').forEach(btn=>{
    btn.addEventListener('click', (e)=>{

  });
}
/* One shared interaction model for mouse, trackpad AND touch/Apple Pencil — Pointer Events
   already unify all three, so there is no separate "mobile path": the same code drives a
   drag on a MacBook trackpad and a drag with a finger on an iPhone. touch-action:none on the
   handles (set in CSS) stops Safari from starting a page-scroll or pinch-zoom gesture the
   moment a handle receives the pointerdown, and setPointerCapture keeps every following
   pointermove routed to this handler even if the finger/cursor drifts off the small handle
   element — so the drag can't get "dropped" mid-gesture.
   The dragged card's OWN box is driven purely by a live pixel transform, exactly like the
   Mood slider's native <input type="range"> tracks the pointer directly — no rounding, no
   waiting for release. Every OTHER widget the drag would now overlap gets pushed out of the
   way and FLIP-animated into its new spot the moment the pointer crosses into a new grid
   cell (not on every pixel — sub-cell movement can't change anyone else's position anyway),
   so the whole board visibly "flows" around the dragged widget in real time. The array (and
   therefore localStorage/cloud sync) is only written once, on release. */
function myspaceMakeDraggable(card, handle, grid){
  handle.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    handle.setPointerCapture(e.pointerId);
    const wid = card.dataset.wid;
    const item = mySpaceLayout.widgets.find(w=> w.id===wid);
    const origX = item.x, origY = item.y;
    let lastCellX = origX, lastCellY = origY;
    const startX = e.clientX, startY = e.clientY;
    const gridRect = grid.getBoundingClientRect();
    const colUnit = (gridRect.width + MYSPACE_GAP_PX) / MYSPACE_COLS;
    card.classList.add('is-dragging');
    function onMove(ev){
      const rawDx = ev.clientX-startX, rawDy = ev.clientY-startY;
      card.style.transform = `translate(${rawDx}px, ${rawDy}px)`;
      const dx = Math.round(rawDx/colUnit), dy = Math.round(rawDy/MYSPACE_ROW_STEP);
      const nx = Math.max(0, Math.min(MYSPACE_COLS-item.w, origX+dx));
      const ny = Math.max(0, origY+dy);
      if(nx!==lastCellX || ny!==lastCellY){
        lastCellX = nx; lastCellY = ny;
        item.x = nx; item.y = ny;
        myspaceReflowAndAnimate(grid, wid);
      }
    }
    function onUp(ev){
      handle.releasePointerCapture(ev.pointerId);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      card.classList.remove('is-dragging');
      card.style.transform = '';
      mySpaceLayout.widgets.sort((a,b)=> (a.y-b.y) || (a.x-b.x)).forEach((w,i)=> w.order=i);
      saveMySpaceLayout();
      buildMySpaceView();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}
/* Same principle for resize, now from all 4 edges AND all 4 corners: the box's rendered
   width/height/position tracks the pointer pixel-for-pixel every move event (a 'w' or 'n'
   drag also has to visually shift the box, since the OPPOSITE edge is the one staying put —
   handled with a translate so it reads as pulling that specific edge/corner, not the whole
   widget). Whichever other widgets that would now overlap get pushed down and FLIP-animated
   out of the way the moment the pointer crosses into a new column/row — same live reflow as
   dragging. Only the committed span (saved on release) snaps to whole columns/rows. */
function myspaceMakeResizable(card, handleEl, grid){
  handleEl.addEventListener('pointerdown', (e)=>{
    e.preventDefault(); e.stopPropagation();
    handleEl.setPointerCapture(e.pointerId);
    const wid = card.dataset.wid;
    const item = mySpaceLayout.widgets.find(w=> w.id===wid);
    const def = mySpaceWidgetDef(wid);
    const minW = def.minW||1, minH = def.minH||2;
    const dir = handleEl.dataset.resize; // 'n'|'s'|'e'|'w'|'ne'|'nw'|'se'|'sw'
    const startX = e.clientX, startY = e.clientY;
    const orig = { x:item.x, y:item.y, w:item.w, h:item.h };
    const gridRect = grid.getBoundingClientRect();
    const colUnit = (gridRect.width + MYSPACE_GAP_PX) / MYSPACE_COLS;
    const origPxW = orig.w*colUnit - MYSPACE_GAP_PX;
    const origPxH = orig.h*MYSPACE_ROW_PX + (orig.h-1)*MYSPACE_GAP_PX;
    let lastCell = { x:orig.x, y:orig.y, w:orig.w, h:orig.h };
    card.classList.add('is-resizing');
    function onMove(ev){
      const dx = ev.clientX-startX, dy = ev.clientY-startY;
      let tx = 0, ty = 0, pxW = origPxW, pxH = origPxH;
      if(dir.includes('e')) pxW = origPxW + dx;
      if(dir.includes('w')){ pxW = origPxW - dx; tx = dx; }
      if(dir.includes('s')) pxH = origPxH + dy;
      if(dir.includes('n')){ pxH = origPxH - dy; ty = dy; }
      card.style.transform = `translate(${tx}px, ${ty}px)`;
      card.style.width = Math.max(40, pxW) + 'px';
      card.style.height = Math.max(28, pxH) + 'px';

      let nx=orig.x, ny=orig.y, nw=orig.w, nh=orig.h;
      if(dir.includes('e')) nw = Math.max(minW, Math.min(MYSPACE_COLS-orig.x, orig.w + Math.round(dx/colUnit)));
      if(dir.includes('w')){
        const dCols = Math.round(dx/colUnit);
        let px = orig.x+dCols, pw = orig.w-dCols;
        if(px<0){ pw += px; px = 0; }
        if(pw<minW){ px += (pw-minW); pw = minW; if(px<0) px=0; }
        nx = px; nw = pw;
      }
      if(dir.includes('s')) nh = Math.max(minH, orig.h + Math.round(dy/MYSPACE_ROW_STEP));
      if(dir.includes('n')){
        const dRows = Math.round(dy/MYSPACE_ROW_STEP);
        let py = orig.y+dRows, ph = orig.h-dRows;
        if(py<0){ ph += py; py = 0; }
        if(ph<minH){ py += (ph-minH); ph = minH; if(py<0) py=0; }
        ny = py; nh = ph;
      }
      if(nx!==lastCell.x || ny!==lastCell.y || nw!==lastCell.w || nh!==lastCell.h){
        lastCell = { x:nx, y:ny, w:nw, h:nh };
        item.x = nx; item.y = ny; item.w = nw; item.h = nh;
        myspaceReflowAndAnimate(grid, wid);
      }
    }
    function onUp(ev){
      handleEl.releasePointerCapture(ev.pointerId);
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      card.classList.remove('is-resizing');
      card.style.width = ''; card.style.height = ''; card.style.transform = '';
      saveMySpaceLayout();
      buildMySpaceView();
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

function monthPhotoCounts(){

  });

}
function photoYearsPresent(){

function buildMediaYearList(){

  }).filter(yb=> yb.rows.length || yb.year === String(APP_YEAR));
  el.innerHTML = `

function buildMediaMonthView(monthIdx, year){

  const prefix = currentMediaYear + '-' + String(monthIdx+1).padStart(2,'0');

    <h2 class="month-view-title" style="font-size:32px;">${monthFullName(monthIdx, currentMediaYear)} <span class="month-view-year">${currentMediaYear}</span></h2>
    ${dateKeys.length ? dateKeys.map(key=>{
      const photos = photosData[key];
      const d = parseDateKey(key);

function moveWidget(id, delta){
  const arr = widgetConfig.enabled;
  const i = arr.indexOf(id); const j = i+delta;
  if(i<0 || j<0 || j>=arr.length) return;
  [arr[i],arr[j]] = [arr[j],arr[i]];
  saveWidgetConfig(); buildWidgetsView();
}
function removeWidgetFromPage(id){
  widgetConfig.enabled = widgetConfig.enabled.filter(x=> x!==id);
  saveWidgetConfig(); buildWidgetsView();
}
function addWidgetToPage(id){
  if(widgetConfig.enabled.includes(id)) return;
  if(SYSTEM_WIDGETS[id] && systemWidgetCount() >= MAX_SYSTEM_WIDGETS) return;
  widgetConfig.enabled.push(id);
  saveWidgetConfig(); buildWidgetsView();
}
function deleteCustomWidget(id){
  const def = widgetConfig.customWidgets.find(w=> w.id===id);
  if(!def) return;
  if(!confirm(t('deleteWidgetConfirm',{name:def.name}))) return;
  widgetConfig.customWidgets = widgetConfig.customWidgets.filter(w=> w.id!==id);
  widgetConfig.enabled = widgetConfig.enabled.filter(x=> x!==id);
  saveWidgetConfig();
  Object.keys(widgetDailyData).forEach(dateKey=>{ delete widgetDailyData[dateKey][id]; });
  saveWidgetDaily();
  buildWidgetsView();

function editCustomWidgetName(id){

/* Interactive tour steps — each points at a REAL element already in the DOM (the bottom nav
   buttons, the My Space edit button) rather than a fake mock-up of the UI. onbGoTo() drives
   the transparent-overlay spotlight/tooltip in onbTour* below when passing through these. */
const TOUR_STEPS = [
  { target:'navBtnSpace',    icon:'🏠', textKey:'onbTourSpaceText' },
  { target:'mySpaceEditBtn', icon:'🧩', textKey:'onbTourWidgetsText' },
  { target:'navBtnDay',      icon:'📔', textKey:'onbTourDayText' },
  { target:'navBtnBudget',   icon:'💶', textKey:'onbTourBudgetText' },
  { target:'navBtnMedia',    icon:'🖼️', textKey:'onbTourMediaText' },
  { target:'navBtnSettings', icon:'⚙️', textKey:'onbTourSettingsText' },
];
function onbTourRenderTip(stepIdx){
  const step = TOUR_STEPS[stepIdx];
  document.getElementById('onbTourTipIcon').textContent = step.icon;
  document.getElementById('onbTourTipText').textContent = t(step.textKey);
  document.getElementById('onbTourTipDots').innerHTML = TOUR_STEPS.map((_,i)=> `<span class="onb-tour-dot${i===stepIdx?' active':''}"></span>`).join('');
  document.getElementById('onbTourSkipBtn').textContent = t('onbSkipTour');
  document.getElementById('onbTourBackBtn').textContent = t('onbBack');
  document.getElementById('onbTourNextBtn').textContent = t('onbNext');
}
/* Positions the hole/ring/tooltip against the target's CURRENT on-screen rect. Uses
   position:fixed + getBoundingClientRect() (viewport coords) so it's correct regardless of
   the onboarding-screen's own flex/padding layout, and is re-run on resize/orientation
   change so it never drifts on rotation or Dynamic Island / safe-area differences. */
function onbTourPosition(stepIdx){
  const step = TOUR_STEPS[stepIdx];
  const targetEl = document.getElementById(step.target);
  if(!targetEl) return;
  const r = targetEl.getBoundingClientRect();
  const pad = 8;
  const hx = r.left - pad, hy = r.top - pad, hw = r.width + pad*2, hh = r.height + pad*2;
  const hole = document.getElementById('onbTourHole');
  const ring = document.getElementById('onbTourRing');
  [hole, ring].forEach(elm=>{
    elm.style.left = hx+'px'; elm.style.top = hy+'px';
    elm.style.width = hw+'px'; elm.style.height = hh+'px';
  });

  const tip = document.getElementById('onbTourTip');
  const vh = window.innerHeight, vw = window.innerWidth;
  const safeTop = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-top')) || 0;
  const safeBottom = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--safe-bottom')) || 0;
  const margin = 14;
  const showAbove = (hy + hh/2) > vh/2;
  tip.classList.toggle('tip-above', showAbove);
  tip.classList.toggle('tip-below', !showAbove);
  const tipRect = tip.getBoundingClientRect();
  let left = hx + hw/2 - tipRect.width/2;
  left = Math.max(margin, Math.min(left, vw - tipRect.width - margin));
  let top = showAbove ? (hy - tipRect.height - 18) : (hy + hh + 18);
  top = Math.max(margin + safeTop, Math.min(top, vh - tipRect.height - margin - safeBottom));
  tip.style.left = left+'px';
  tip.style.top = top+'px';

  const arrow = document.getElementById('onbTourTipArrow');
  let arrowLeft = (hx + hw/2) - left - 8;
  arrowLeft = Math.max(14, Math.min(arrowLeft, tipRect.width - 14 - 16));
  arrow.style.left = arrowLeft+'px';
}
function onbTourShowStep(stepIdx){
  document.getElementById('onbTourOverlay').style.display = 'block';
  onbTourRenderTip(stepIdx);
  onbTourPosition(stepIdx);

}

  if(selected.has('notes')){
    blocks.push(`<div class="onb-field-block">
      <div class="onb-field-label">${widgetIcon('notes')} ${t('widgetNotes')}</div>
      <textarea class="diary-text-input diary-textarea" id="onbNoteInput" placeholder="${t('onbNotePlaceholder')}" maxlength="400">${onbState.firstDay.note.replace(/</g,'&lt;')}</textarea>
    </div>`);
  }
  if(selected.has('water')){
    blocks.push(`<div class="onb-field-block">
      <div class="onb-field-label">${widgetIcon('water')} ${t('widgetWater')}</div>
      <button type="button" class="onb-choice-btn${onbState.firstDay.water?' selected':''}" id="onbWaterBtn" style="width:100%;">${onbState.firstDay.water ? '✓' : '+'}</button>
    </div>`);
  }
  if(selected.has('sleep')){
    blocks.push(`<div class="onb-field-block">
      <div class="onb-field-label">${widgetIcon('sleep')} ${t('sleepLabelHrs')}</div>
      <input type="number" class="diary-text-input" id="onbSleepInput" min="0" max="24" step="0.5" value="${onbState.firstDay.sleepHrs}" style="max-width:110px;">
    </div>`);
  }
  ONB_FIRSTDAY_GENERIC_IDS.forEach(id=>{
    if(!selected.has(id)) return;
    const def = SYSTEM_WIDGETS[id];
    const val = onbState.firstDay.generic[id] || '';
    blocks.push(`<div class="onb-field-block">
      <div class="onb-field-label">${widgetIcon(id)} ${t(def.labelKey)}</div>
      <input type="${def.kind==='number'?'number':'text'}" class="diary-text-input" data-generic="${id}" placeholder="${t('onbGenericPlaceholder')}" value="${('' + val).replace(/</g,'&lt;').replace(/"/g,'&quot;')}">
    </div>`);
  });
  const body = blocks.length ? blocks.join('') : `
    <div class="diary-body" style="margin-top:20px;">${t('onbFirstDayEmpty')}</div>
    <div class="onb-field-block"><textarea class="diary-text-input diary-textarea" id="onbFallbackNote" placeholder="${t('onbNotePlaceholder')}">${onbState.firstDay.note.replace(/</g,'&lt;')}</textarea></div>`;
  return `
    <div class="diary-title" style="font-size:26px;">${t('onbFirstDayTitle')}</div>
    <div class="diary-sub">${t('onbFirstDaySub',{date:fmtFull(todayReal)})}</div>
    ${body}
    <div class="diary-sub" style="margin-top:16px;">${t('onbFirstDayHint')}</div>
  `;
}
function onbWireFirstDay(root){
  const moodBtns = root.querySelectorAll('[data-mood]');
  moodBtns.forEach(btn=> btn.addEventListener('click', ()=>{
    onbState.firstDay.mood = parseInt(btn.dataset.mood, 10);
    moodBtns.forEach(b=> b.classList.toggle('selected', b===btn));
  }));
  const task = root.querySelector('#onbTaskInput'); if(task) task.addEventListener('input', ()=>{ onbState.firstDay.task = task.value; });
  const note = root.querySelector('#onbNoteInput'); if(note) note.addEventListener('input', ()=>{ onbState.firstDay.note = note.value; });
  const fallbackNote = root.querySelector('#onbFallbackNote'); if(fallbackNote) fallbackNote.addEventListener('input', ()=>{ onbState.firstDay.note = fallbackNote.value; });
  const waterBtn = root.querySelector('#onbWaterBtn');
  if(waterBtn) waterBtn.addEventListener('click', ()=>{
    onbState.firstDay.water = !onbState.firstDay.water;
    waterBtn.classList.toggle('selected', onbState.firstDay.water);
    waterBtn.textContent = onbState.firstDay.water ? '✓' : '+';
  });
  const sleep = root.querySelector('#onbSleepInput'); if(sleep) sleep.addEventListener('input', ()=>{ onbState.firstDay.sleepHrs = sleep.value; });
  root.querySelectorAll('[data-generic]').forEach(inp=> inp.addEventListener('input', ()=>{ onbState.firstDay.generic[inp.dataset.generic] = inp.value; }));
}

function onbRenderDone(){
  return `
    <div class="diary-title">${t('onbDoneTitle')}</div>
    <div class="diary-hand">${t('onbDoneSub')}</div>
    <div class="diary-spacer"></div>
  `;
}

const ONB_PAGES = [
  { id:'name',       render:onbRenderName,            canAdvance:()=> onbState.name.trim().length>0 },
  { id:'why',        render:onbRenderWhy },
  { id:'widgets',    render:onbRenderWidgets,         skippable:true },
  { id:'appearance', render:onbRenderAppearance,      skippable:true },
  { id:'avatar',     render:onbRenderAvatar,          skippable:true },
  { id:'tour1',      render:()=>'', skippable:true, isTour:true, tourStep:0 },
  { id:'tour2',      render:()=>'', skippable:true, isTour:true, tourStep:1 },
  { id:'tour3',      render:()=>'', skippable:true, isTour:true, tourStep:2 },
  { id:'tour4',      render:()=>'', skippable:true, isTour:true, tourStep:3 },
  { id:'tour5',      render:()=>'', skippable:true, isTour:true, tourStep:4 },
  { id:'tour6',      render:()=>'', skippable:true, isTour:true, tourStep:5 },
  { id:'firstday',   render:onbRenderFirstDay,        skippable:true },
  { id:'done',       render:onbRenderDone,            isFinal:true },
];
function onbWirePage(root, index){
  const id = ONB_PAGES[index].id;
  if(id==='name') onbWireName(root);
  else if(id==='widgets') onbWireWidgets(root);
  else if(id==='appearance') onbWireAppearance(root);
  else if(id==='avatar') onbWireAvatar(root);
  else if(id==='firstday') onbWireFirstDay(root);
}

let onbIndex = 0;
let onbAnimating = false;
let onbSlotA, onbSlotB, onbFrontEl, onbBackEl;
function onbReduceMotion(){
  try{ return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}

function onbRenderInto(el, index){
  el.innerHTML = ONB_PAGES[index].render();
  onbWirePage(el, index);
}
function onbUpdateNav(){
  const backBtn = document.getElementById('onbBackBtn');
  const nextBtn = document.getElementById('onbNextBtn');
  const skipBtn = document.getElementById('onbSkipBtn');
  const dots = document.getElementById('onbDots');
  const page = ONB_PAGES[onbIndex];
  backBtn.textContent = t('onbBack');
  backBtn.classList.toggle('invisible', onbIndex === 0);
  const canAdvance = page.canAdvance ? page.canAdvance() : true;
  nextBtn.disabled = !canAdvance;
  nextBtn.textContent = page.isFinal ? t('onbEnterSpace') : t('onbNext');
  if(page.skippable){
    skipBtn.style.display = '';
    skipBtn.textContent = page.isTour ? t('onbSkipTour') : t('onbSkip');
  } else {
    skipBtn.style.display = 'none';
  }
  dots.innerHTML = ONB_PAGES.map((_,i)=> `<span class="onb-dot${i===onbIndex?' active':''}"></span>`).join('');
}
function onbGoTo(newIndex, dir){
  if(onbAnimating || newIndex===onbIndex || newIndex<0 || newIndex>=ONB_PAGES.length) return;
  const oldPage = ONB_PAGES[onbIndex];
  const newPage = ONB_PAGES[newIndex];

  // Tour pages don't live on a diary page at all — they spotlight the REAL app UI behind a
  // transparent onboarding-screen, so entering/leaving/moving between them skips the
  // diary-page-turn machinery below entirely and just (re)positions the overlay.
  if(newPage.isTour){
    if(!oldPage.isTour){
      document.getElementById('onboardingScreen').classList.add('onb-tour-mode');
      showMySpaceView();
    }
    onbIndex = newIndex;
    onbUpdateNav();
    onbTourShowStep(newPage.tourStep);
    return;
  }
  if(oldPage.isTour){
    onbTourHide();
    document.getElementById('onboardingScreen').classList.remove('onb-tour-mode');
  }

  onbAnimating = true;
  const incoming = (onbFrontEl === onbSlotA) ? onbSlotB : onbSlotA;
  onbRenderInto(incoming, newIndex);
  incoming.style.visibility = 'visible';

  if(onbReduceMotion()){
    incoming.style.zIndex = 1; onbFrontEl.style.zIndex = 2;
    onbFrontEl.classList.remove('turned');
    void onbFrontEl.offsetWidth;
    onbFrontEl.classList.add('turn-anim');
    requestAnimationFrame(()=> onbFrontEl.classList.add('turned'));
    const outgoing = onbFrontEl;
    const done = ()=>{
      outgoing.removeEventListener('transitionend', done);
      outgoing.classList.remove('turn-anim','turned');
      outgoing.style.visibility = 'hidden';
      onbFrontEl = incoming; onbBackEl = outgoing;
      onbIndex = newIndex; onbAnimating = false; onbUpdateNav();
    };
    outgoing.addEventListener('transitionend', done);
    return;
  }

  let animatedEl;
  if(dir === 1){
    incoming.style.zIndex = 1; incoming.classList.remove('turn-anim','turned');
    onbFrontEl.style.zIndex = 2; onbFrontEl.classList.remove('turn-anim','turned');
    void onbFrontEl.offsetWidth;
    onbFrontEl.classList.add('turn-anim');
    requestAnimationFrame(()=> onbFrontEl.classList.add('turned'));
    animatedEl = onbFrontEl;
  } else {
    incoming.style.zIndex = 2; incoming.classList.remove('turn-anim'); incoming.classList.add('turned');
    onbFrontEl.style.zIndex = 1; onbFrontEl.classList.remove('turn-anim','turned');
    void incoming.offsetWidth;
    incoming.classList.add('turn-anim');
    requestAnimationFrame(()=> incoming.classList.remove('turned'));
    animatedEl = incoming;
  }
  const outgoingWasFront = onbFrontEl;
  const done = ()=>{
    animatedEl.removeEventListener('transitionend', done);
    if(dir === 1) outgoingWasFront.style.visibility = 'hidden';
    onbFrontEl = incoming; onbBackEl = (incoming===onbSlotA) ? onbSlotB : onbSlotA;
    onbIndex = newIndex; onbAnimating = false; onbUpdateNav();
  };
  animatedEl.addEventListener('transitionend', done);
}
function onbHandleNext(){
  const page = ONB_PAGES[onbIndex];
  if(page.canAdvance && !page.canAdvance()) return;
  if(page.isFinal){ onbFinish(); return; }
  onbGoTo(onbIndex + 1, 1);
}
function onbHandleSkip(){
  const page = ONB_PAGES[onbIndex];
  if(page.isTour){
    onbGoTo(ONB_PAGES.findIndex(p=> p.id==='firstday'), 1);
  } else {
    onbGoTo(onbIndex + 1, 1);
  }
}
function onbFinish(){
  if(onbState.name.trim()) save(USER_NAME_KEY, onbState.name.trim());
  widgetConfig.enabled = Array.from(onbState.widgets).slice(0, MAX_SYSTEM_WIDGETS);
  saveWidgetConfig();
  // My Space and My Day are separate customization surfaces (mySpaceLayout vs
  // widgetConfig.enabled) — without this, a fresh account's My Space would ship the generic
  // starter layout regardless of what was actually picked during onboarding. Mandatory
  // launchers always come first; only widgets the user kept selected get a My Space card.
  mySpaceLayout = myspaceDefaultLayout([...MYSPACE_MANDATORY_IDS, ...Array.from(onbState.widgets).filter(id=> !MYSPACE_MANDATORY_IDS.includes(id))]);
  saveMySpaceLayout();
  setTheme(onbState.theme);
  save(APPEARANCE_KEY, onbState.appearance);
  applyAppearance(onbState.appearance);
  if(onbState.avatar) save(AVATAR_KEY, onbState.avatar);
  updateHeaderAvatar();

  const key = dateKeyOf(todayReal);
  const dd = ensureDayData(key);
  if(onbState.firstDay.mood !== null) dd.mood = onbState.firstDay.mood;
  if(onbState.firstDay.task.trim()) dd.todos.push({ text: onbState.firstDay.task.trim(), done:false, vibe:'' });
  if(onbState.firstDay.note.trim()) dd.notes = onbState.firstDay.note.trim();
  if(onbState.firstDay.water){ dd.waterMl = Math.max(dd.waterMl||0, 250); dd.waterLog.push(250); }
  if(onbState.firstDay.sleepHrs !== '' && !isNaN(parseFloat(onbState.firstDay.sleepHrs))) dd.sleep = parseFloat(onbState.firstDay.sleepHrs);
  save('wp-days-v5', daysData);
  const wd = ensureWidgetDay(key);
  Object.keys(onbState.firstDay.generic).forEach(wid=>{
    const v = onbState.firstDay.generic[wid];
    if(v !== undefined && v !== '') wd[wid] = v;
  });
  saveWidgetDaily();

  save(ONBOARDING_COMPLETE_KEY, true);
  document.getElementById('onboardingScreen').classList.add('hidden');
  showMySpaceView();
}
function startOnboarding(){
  onbSlotA = document.getElementById('diaryPageA');
  onbSlotB = document.getElementById('diaryPageB');
  onbFrontEl = onbSlotA; onbBackEl = onbSlotB;
  onbSlotA.style.zIndex = 2; onbSlotA.style.visibility = 'visible';
  onbSlotB.style.zIndex = 1; onbSlotB.style.visibility = 'hidden';
  onbIndex = 0;
  onbRenderInto(onbSlotA, 0);
  onbUpdateNav();
  document.getElementById('onboardingScreen').classList.remove('hidden');

  document.getElementById('onbNextBtn').addEventListener('click', onbHandleNext);
  document.getElementById('onbBackBtn').addEventListener('click', ()=> onbGoTo(onbIndex - 1, -1));
  document.getElementById('onbSkipBtn').addEventListener('click', onbHandleSkip);

  // The tour spotlight's own compact controls reuse the exact same handlers as the diary
  // book's nav bar — they're just a second, differently-styled set of buttons for the
  // moments when the diary book itself is hidden (see .onb-tour-mode).
  document.getElementById('onbTourNextBtn').addEventListener('click', onbHandleNext);
  document.getElementById('onbTourBackBtn').addEventListener('click', ()=> onbGoTo(onbIndex - 1, -1));
  document.getElementById('onbTourSkipBtn').addEventListener('click', onbHandleSkip);

  // Swipe is a convenience gesture layered on top of the buttons (which remain the primary,
  // always-visible way to navigate) — a tiny/aborted swipe simply never crosses the distance
  // threshold below, so there is no partial "stuck mid-turn" state to recover from.
  const book = document.getElementById('diaryBook');
  let dragStartX = null, dragStartY = null, dragging = false;
  book.addEventListener('pointerdown', (e)=>{
    if(onbAnimating) return;
    // Only real form controls need protecting from an accidental drag (native text
    // selection, a date/number input's own drag handling) — plain <button>s (which cover
    // most of the widgets/theme/appearance/avatar pages) must NOT be excluded here, or
    // swipe-to-navigate would be silently dead almost everywhere on those pages. A real tap
    // on a button still works fine either way: this only ever acts once the drag crosses
    // the 60px threshold below, which a tap never does, so the button's own click still fires.
    if(e.target.closest('input,textarea,select')) return;
    dragStartX = e.clientX; dragStartY = e.clientY; dragging = true;
  });
  book.addEventListener('pointerup', (e)=>{
    if(!dragging) return;
    dragging = false;
    const dx = e.clientX - dragStartX, dy = e.clientY - dragStartY;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) onbHandleNext();
      else if(onbIndex > 0) onbGoTo(onbIndex - 1, -1);
    }
  });
  book.addEventListener('pointercancel', ()=>{ dragging = false; });
}

/* ============ START ============ */
applyAppearance(load(APPEARANCE_KEY, 'system'));
if(needsOnboarding()) startOnboarding(); else showMySpaceView();
} /* end buildApp() */
</script>
</body>
</html>
